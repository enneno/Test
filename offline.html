<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#b9858f">
  <title>Nincs internetkapcsolat | Lumi Nails</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 28px; background: #fdf4e2; color: #2b2521; text-align: center; }
    main { width: min(100%, 440px); background: #fffaf4; border: 1px solid rgba(185,133,143,.22); border-radius: 28px; padding: 34px 26px; box-shadow: 0 14px 34px rgba(70,48,42,.10); }
    img { width: 76px; height: 76px; border-radius: 20px; }
    h1 { margin: 22px 0 10px; font-size: 28px; }
    p { margin: 0 0 24px; line-height: 1.55; color: #655e57; }
    button { appearance: none; border: 0; border-radius: 999px; min-height: 46px; padding: 0 24px; background: #b9858f; color: white; font: inherit; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/kepek/favicon-192.png" alt="Lumi Nails">
    <h1>Nincs internetkapcsolat</h1>
    <p>A már betöltött publikus oldalak egy része továbbra is elérhető. Az időpontfoglaláshoz, a fiókhoz és az adminhoz internetkapcsolat szükséges.</p>
    <button type="button" onclick="location.reload()">Újrapróbálom</button>
  </main>
</body>
</html>
