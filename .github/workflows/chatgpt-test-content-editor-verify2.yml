name: Verify content editor redesign v2

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - '.github/workflows/chatgpt-test-content-editor-verify2.yml'

permissions:
  contents: write

jobs:
  build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Patch canonical content editor styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/admin-styles/40-content-editor.css')
          css = path.read_text(encoding='utf-8')
          replacements = [
              ('''.admin-body.admin-v2 #admin-panel-szovegek .cms-editor-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 10px;
          }''', '''.admin-body.admin-v2 #admin-panel-szovegek .cms-editor-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 0;
          }'''),
              ('''.admin-body.admin-v2 #admin-panel-szovegek .cms-section-picker {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border: 1px solid var(--admin-v2-border);
            border-radius: 13px;
            background: var(--admin-v2-surface);
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-section-picker > span {
            color: var(--admin-v2-muted);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            white-space: nowrap;
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-section-picker select {
            width: 100%;
            min-width: 0;
            min-height: var(--admin-ui-choice-height);
            padding: 0 34px 0 10px;
            border: 1px solid var(--admin-v2-border);
            border-radius: 10px;
            color: var(--admin-v2-ink);
            background-color: var(--admin-v2-surface-soft);
            box-shadow: none;
            font-size: 12px;
            font-weight: 600;
          }''', '''.admin-body.admin-v2 #admin-panel-szovegek .cms-section-picker {
            display: block;
            padding: 10px;
            border: 1px solid var(--admin-v2-border);
            border-bottom: 0;
            border-radius: 15px 15px 0 0;
            background: var(--admin-v2-surface-soft);
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-section-picker > span {
            display: none;
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-section-picker select {
            width: 100%;
            min-width: 0;
            min-height: 46px;
            padding: 0 40px 0 14px;
            border: 1px solid var(--admin-v2-border);
            border-radius: 11px;
            color: var(--admin-v2-ink);
            background-color: var(--admin-v2-surface);
            box-shadow: 0 2px 8px rgba(67, 42, 35, .045);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
          }'''),
              ('''.admin-body.admin-v2 #admin-panel-szovegek .cms-editor-card {
            overflow: hidden;
            border: 1px solid var(--admin-v2-border);
            border-radius: 15px;
            background: var(--admin-v2-surface);
            box-shadow: var(--admin-v2-shadow);
          }''', '''.admin-body.admin-v2 #admin-panel-szovegek .cms-editor-card {
            overflow: hidden;
            border: 1px solid var(--admin-v2-border);
            border-radius: 15px;
            background: var(--admin-v2-surface);
            box-shadow: var(--admin-v2-shadow);
          }
          .admin-body.admin-v2 #admin-panel-szovegek #admin-cms-root:not([data-lumi-cms-gallery-context="images"]) .cms-editor-card {
            border-radius: 0 0 15px 15px;
          }'''),
              ('''.admin-body.admin-v2 #admin-panel-szovegek .cms-editor-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 52px;
            padding: 11px 14px;
            border-bottom: 1px solid var(--admin-v2-border);
            background: var(--admin-v2-surface-soft);
          }''', '''.admin-body.admin-v2 #admin-panel-szovegek .cms-editor-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 52px;
            padding: 11px 14px;
            border-bottom: 1px solid var(--admin-v2-border);
            background: var(--admin-v2-surface-soft);
          }
          .admin-body.admin-v2 #admin-panel-szovegek #admin-cms-root:not([data-lumi-cms-gallery-context="images"]) .cms-editor-card-header {
            display: none;
          }'''),
              ('''.admin-body.admin-v2 #admin-panel-szovegek .cms-fieldsets { display: block; }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset {
            margin: 0;
            overflow: visible;
            border: 0;
            border-bottom: 1px solid var(--admin-v2-border);
            border-radius: 0;
            background: transparent;
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset:last-child { border-bottom: 0; }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset summary {
            min-height: 48px;
            padding: 0 14px;
            font-size: 11px;
            font-weight: 600;
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset summary small { color: var(--admin-v2-subtle); font-size: 9px; font-weight: 600; }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset[open] > summary { color: var(--admin-v2-brand-dark); background: var(--admin-v2-brand-soft); }''', '''.admin-body.admin-v2 #admin-panel-szovegek .cms-fieldsets {
            display: grid;
            gap: 8px;
            padding: 10px;
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset {
            margin: 0;
            overflow: hidden;
            border: 1px solid var(--admin-v2-border);
            border-radius: 12px;
            background: var(--admin-v2-surface);
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset summary {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto 18px;
            align-items: center;
            gap: 10px;
            min-height: 50px;
            padding: 8px 12px;
            list-style: none;
            color: var(--admin-v2-ink);
            background: var(--admin-v2-surface);
            font-size: 12px;
            font-weight: 600;
            line-height: 1.25;
            cursor: pointer;
            transition: color 150ms ease, background-color 150ms ease, box-shadow 150ms ease;
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset summary::-webkit-details-marker { display: none; }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset summary::marker { content: ''; }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset summary::after {
            content: '';
            width: 7px;
            height: 7px;
            justify-self: center;
            border-right: 1.5px solid currentColor;
            border-bottom: 1.5px solid currentColor;
            transform: rotate(45deg) translate(-1px, -1px);
            transition: transform 150ms ease;
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset summary:hover {
            background: var(--admin-v2-surface-soft);
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset summary small {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            padding: 3px 8px;
            border: 1px solid var(--admin-v2-border);
            border-radius: 999px;
            color: var(--admin-v2-subtle);
            background: var(--admin-v2-surface-soft);
            font-size: 9px;
            font-weight: 600;
            line-height: 1;
            white-space: nowrap;
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset[open] > summary {
            color: var(--admin-v2-brand-dark);
            background: var(--admin-v2-brand-soft);
            box-shadow: inset 3px 0 0 rgba(163, 93, 117, .45);
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset[open] > summary:hover {
            background: var(--admin-v2-brand-soft);
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset[open] > summary::after {
            transform: rotate(225deg) translate(-1px, -1px);
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset[open] > summary small {
            color: var(--admin-v2-brand-dark);
            border-color: rgba(163, 93, 117, .22);
            background: rgba(255, 255, 255, .58);
          }
          .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset[open] > .cms-fieldset-grid {
            border-top: 1px solid var(--admin-v2-border);
          }'''),
              ('''  .admin-body.admin-v2 #admin-panel-szovegek .cms-section-picker { padding: 8px 10px; }
            .admin-body.admin-v2 #admin-panel-szovegek .cms-editor-card { border-radius: 13px; }''', '''  .admin-body.admin-v2 #admin-panel-szovegek .cms-section-picker {
              padding: 8px;
              border-radius: 13px 13px 0 0;
            }
            .admin-body.admin-v2 #admin-panel-szovegek .cms-section-picker select {
              min-height: 44px;
              padding-left: 12px;
              font-size: 12px;
            }
            .admin-body.admin-v2 #admin-panel-szovegek .cms-editor-card { border-radius: 13px; }
            .admin-body.admin-v2 #admin-panel-szovegek #admin-cms-root:not([data-lumi-cms-gallery-context="images"]) .cms-editor-card {
              border-radius: 0 0 13px 13px;
            }
            .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldsets {
              gap: 7px;
              padding: 8px;
            }
            .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset summary {
              min-height: 48px;
              gap: 8px;
              padding: 7px 10px;
            }
            .admin-body.admin-v2 #admin-panel-szovegek .cms-fieldset summary small {
              min-height: 22px;
              padding: 3px 7px;
            }''')
          ]
          for old, new in replacements:
              if css.count(old) != 1:
                  raise SystemExit(f'Canonical block mismatch: {old.splitlines()[0]}')
              css = css.replace(old, new)
          if '!important' in css:
              raise SystemExit('Unexpected !important')
          path.write_text(css, encoding='utf-8')
          PY

      - name: Write focused regression test
        shell: bash
        run: |
          cat > tests/admin-content-editor-accordion.spec.js <<'EOF'
          const { test, expect } = require('playwright/test');
          const fs = require('fs');
          const path = require('path');

          test('content section selector becomes the block header and accordions stay compact on mobile', async ({ page }) => {
              const css = fs.readFileSync(path.join(__dirname, '..', 'src', 'admin-styles', '40-content-editor.css'), 'utf8');
              await page.setViewportSize({ width: 390, height: 844 });
              await page.setContent(`<!doctype html><html><head><style>
                  :root { --admin-v2-border:#e4d9d3; --admin-v2-surface:#fffdfb; --admin-v2-surface-soft:#f8f4f1; --admin-v2-ink:#2f2825; --admin-v2-muted:#756965; --admin-v2-subtle:#9a8f8a; --admin-v2-brand-dark:#71453d; --admin-v2-brand-soft:#f5e9e7; --admin-v2-brand:#a35d75; --admin-v2-shadow:0 6px 20px rgba(67,42,35,.08); --admin-ui-choice-height:42px; }
                  * { box-sizing:border-box; } body { margin:0; } ${css}
              </style></head><body class="admin-body admin-v2"><div id="admin-panel-szovegek"><div id="admin-cms-root"><div class="cms-editor-layout">
                  <label class="cms-section-picker"><span>Szerkesztett szekció</span><select><option>kapcsolatfelvételi lehetőségek</option></select></label>
                  <nav class="cms-section-index"></nav><section class="cms-editor-card"><div class="cms-editor-card-header"><h3>Foglalás – kapcsolatfelvételi lehetőségek</h3></div><div class="cms-section-body"><div class="cms-fieldsets">
                  <details class="cms-fieldset" open><summary><span>Instagram</span><small>3 mező</small></summary><div class="admin-grid cms-field-grid cms-fieldset-grid"></div></details>
                  <details class="cms-fieldset"><summary><span>Messenger</span><small>3 mező</small></summary><div class="admin-grid cms-field-grid cms-fieldset-grid"></div></details>
                  </div></div></section></div></div></div></body></html>`);
              const metrics = await page.evaluate(() => {
                  const picker=document.querySelector('.cms-section-picker'); const select=picker.querySelector('select'); const card=document.querySelector('.cms-editor-card'); const header=document.querySelector('.cms-editor-card-header'); const open=document.querySelector('.cms-fieldset[open] summary'); const closed=document.querySelector('.cms-fieldset:not([open]) summary'); const badge=open.querySelector('small');
                  return { labelDisplay:getComputedStyle(picker.querySelector('span')).display, headerDisplay:getComputedStyle(header).display, layoutGap:getComputedStyle(document.querySelector('.cms-editor-layout')).rowGap, seam:Math.abs(card.getBoundingClientRect().top-picker.getBoundingClientRect().bottom), selectHeight:select.getBoundingClientRect().height, summaryDisplay:getComputedStyle(open).display, summaryHeight:open.getBoundingClientRect().height, radius:parseFloat(getComputedStyle(open.closest('.cms-fieldset')).borderTopLeftRadius), badgeRadius:parseFloat(getComputedStyle(badge).borderTopLeftRadius), openBg:getComputedStyle(open).backgroundColor, closedBg:getComputedStyle(closed).backgroundColor, overflow:document.documentElement.scrollWidth-window.innerWidth };
              });
              expect(metrics.labelDisplay).toBe('none');
              expect(metrics.headerDisplay).toBe('none');
              expect(metrics.layoutGap).toBe('0px');
              expect(metrics.seam).toBeLessThanOrEqual(1);
              expect(metrics.selectHeight).toBeGreaterThanOrEqual(44);
              expect(metrics.summaryDisplay).toBe('grid');
              expect(metrics.summaryHeight).toBeGreaterThanOrEqual(48);
              expect(metrics.summaryHeight).toBeLessThanOrEqual(52);
              expect(metrics.radius).toBeGreaterThanOrEqual(10);
              expect(metrics.badgeRadius).toBeGreaterThanOrEqual(20);
              expect(metrics.openBg).not.toBe(metrics.closedBg);
              expect(metrics.overflow).toBeLessThanOrEqual(1);
          });
          EOF

      - name: Verify no override hacks
        run: |
          ! grep -q '!important' src/admin-styles/40-content-editor.css
          grep -q 'grid-template-columns: minmax(0, 1fr) auto 18px' src/admin-styles/40-content-editor.css

      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Version assets
        run: npm run assets:version
      - name: Check
        run: npm run check
      - name: Install Edge
        run: npx playwright install --with-deps msedge
      - name: Admin tests
        run: npm run test:admin
      - name: Focused regression
        run: npx playwright test tests/admin-content-editor-accordion.spec.js

      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin-styles/40-content-editor.css tests/admin-content-editor-accordion.spec.js admin-v2.css admin/index.html
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 1
          fi
          git commit -m 'Redesign content section selector and accordions'
          git push origin HEAD:CHATGPT_TEST
