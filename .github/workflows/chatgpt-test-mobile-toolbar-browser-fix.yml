name: Fix mobile toolbar browser breakpoint

on:
  push:
    branches: [CHATGPT_TEST]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch canonical mobile toolbar rules
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const cssPath = 'src/admin-styles/30-bookings.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          const oldBreakpoint = '@container admin-workspace (max-width: 480px) {';
          const newBreakpoint = '@media (max-width: 480px) {';
          if (!css.includes(oldBreakpoint)) throw new Error('Expected container breakpoint not found');
          css = css.replace(oldBreakpoint, newBreakpoint);
          fs.writeFileSync(cssPath, css);

          const jsPath = 'src/admin/05-admin-workspace-v2.js';
          let js = fs.readFileSync(jsPath, 'utf8');
          const oldBlock = `            if (pageActions && frissitesGomb) {\n                frissitesGomb.className = 'admin-v2-button admin-v2-button-secondary admin-v2-refresh-action';\n                pageActions.append(frissitesGomb);\n            }`;
          const newBlock = `            if (pageActions && frissitesGomb) {\n                const regiMuveletTarolo = frissitesGomb.closest('.admin-foglalas-muvelet-tarolo');\n                frissitesGomb.className = 'admin-v2-button admin-v2-button-secondary admin-v2-refresh-action';\n                pageActions.append(frissitesGomb);\n                if (regiMuveletTarolo && !regiMuveletTarolo.children.length) regiMuveletTarolo.remove();\n            }`;
          if (!js.includes(oldBlock)) throw new Error('Expected refresh move block not found');
          js = js.replace(oldBlock, newBlock);
          fs.writeFileSync(jsPath, js);
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify generated mobile toolbar
        shell: bash
        run: |
          grep -q '@media (max-width: 480px)' src/admin-styles/30-bookings.css
          ! grep -q '@container admin-workspace (max-width: 480px)' src/admin-styles/30-bookings.css
          grep -q 'width: 96px' src/admin-styles/30-bookings.css
          grep -q 'regiMuveletTarolo' src/admin/05-admin-workspace-v2.js
          grep -q 'admin-v2-refresh-action' admin-supabase.js
      - name: Commit verified result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-test-mobile-toolbar-browser-fix.yml
          git add -A
          git commit -m "Fix mobile booking toolbar breakpoint"
          git push origin CHATGPT_TEST
