name: Worktime mobile verification

on:
  push:
    branches:
      - CHATGPT_TEST
    paths:
      - .github/workflows/chatgpt-test-worktime-mobile-final2.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply changes
        run: python3 scripts/chatgpt-worktime-mobile.py
      - name: Reject override hacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for f in ['src/admin-styles/10-components.css','src/admin-styles/20-workspace.css','src/admin-styles/70-availability.css']:
              code = re.sub(r'/\*.*?\*/', '', Path(f).read_text(encoding='utf-8'), flags=re.S)
              if '!important' in code:
                  raise SystemExit(f'!important found in {f}')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Version assets
        run: npm run assets:version
      - name: Check
        run: npm run check
      - name: Install Edge
        run: npx playwright install --with-deps msedge
      - name: Affected admin tests
        run: npx playwright test tests/admin-availability-mobile.spec.js tests/admin-shared-components.spec.js tests/admin-v2-regressions.spec.js tests/admin-production-redesign.spec.js
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish worktime mobile controls"
          git push origin HEAD:CHATGPT_TEST
