name: Set CHATGPT_TEST datetime text to 12px

on:
  push:
    branches: [CHATGPT_TEST]

permissions:
  contents: write

jobs:
  tune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0
      - name: Patch canonical booking CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/admin-styles/30-bookings.css')
          s=p.read_text()
          s=s.replace('font-size: 7px;\n  font-weight: 720;', 'font-size: 12px;\n  font-weight: 720;', 1)
          s=s.replace('font-size: 7px;\n  line-height: 1;\n  text-align: left;', 'font-size: 12px;\n  line-height: 1;\n  text-align: left;', 1)
          s=s.replace('font-size: 7px;\n  line-height: 1;\n}', 'font-size: 12px;\n  line-height: 1;\n}', 2)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Commit canonical change and remove workflow
        shell: bash
        run: |
          rm .github/workflows/chatgpt-test-datetime-12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin-styles/30-bookings.css admin-v2.css admin/index.html .github/workflows/chatgpt-test-datetime-12.yml
          git commit -m 'Set booking datetime text to 12px' || exit 0
          git push origin HEAD:CHATGPT_TEST
