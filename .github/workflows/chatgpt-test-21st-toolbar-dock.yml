name: Build 21st-style PWA toolbar dock

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - '.github/workflows/chatgpt-test-21st-toolbar-dock.yml'

permissions:
  contents: write

jobs:
  build-toolbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Replace standalone toolbar with 21st-style dock
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          shell_path = Path('pwa-admin-shell.js')
          shell = shell_path.read_text(encoding='utf-8')
          shell = shell.replace("tabbar.className = 'pwa-admin-tabbar';", "tabbar.className = 'pwa-admin-toolbar-dock';")
          shell = shell.replace('pwa-admin-tabbar-count', 'pwa-admin-toolbar-count')
          shell = shell.replace('pwa-admin-tabbar-dot', 'pwa-admin-toolbar-dot')
          shell = shell.replace('pwa-admin-tabbar-save', 'pwa-admin-toolbar-save')
          shell = shell.replace('pwa-admin-tabbar-button', 'pwa-admin-toolbar-button')
          bell = "      ${appButton('bell', 'Értesítések', 'data-pwa-admin-notifications aria-expanded=\"false\" aria-controls=\"admin-v2-notification-panel\"', '<span class=\"pwa-admin-toolbar-dot\" data-admin-v2-email-alert data-admin-v2-notification-alert hidden></span>')}"
          overview = "      ${appButton('overview', 'Áttekintés', 'data-admin-v2-nav=\"attekintes\"')}"
          if bell not in shell:
              raise SystemExit('Expected notification toolbar item not found')
          shell = shell.replace(bell, bell + '\n' + overview, 1)
          plus_icon = "      plus: '<path d=\"M12 5v14M5 12h14\"></path>'"
          overview_icon = "      plus: '<path d=\"M12 5v14M5 12h14\"></path>',\n      overview: '<rect x=\"4\" y=\"4\" width=\"6\" height=\"6\" rx=\"1\"></rect><rect x=\"14\" y=\"4\" width=\"6\" height=\"6\" rx=\"1\"></rect><rect x=\"4\" y=\"14\" width=\"6\" height=\"6\" rx=\"1\"></rect><rect x=\"14\" y=\"14\" width=\"6\" height=\"6\" rx=\"1\"></rect>'"
          if plus_icon not in shell:
              raise SystemExit('Expected plus icon not found')
          shell = shell.replace(plus_icon, overview_icon, 1)
          shell_path.write_text(shell, encoding='utf-8')

          css_path = Path('src/admin-styles/95-pwa.css')
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('  --pwa-admin-tabbar-height: 58px;\n  --pwa-admin-tabbar-visual-bottom: 0px;', '  --pwa-admin-toolbar-height: 56px;\n  --pwa-admin-toolbar-bottom: max(10px, env(safe-area-inset-bottom, 0px));')
          css = css.replace('calc(var(--pwa-admin-tabbar-height) + env(safe-area-inset-bottom, 0px) + 12px)', 'calc(var(--pwa-admin-toolbar-height) + var(--pwa-admin-toolbar-bottom) + 12px)')
          css = css.replace('calc(var(--pwa-admin-tabbar-height) + env(safe-area-inset-bottom, 0px) + 30px)', 'calc(var(--pwa-admin-toolbar-height) + var(--pwa-admin-toolbar-bottom) + 30px)')
          replacement = base64.b64decode('').decode('utf-8')
          pattern = re.compile(r'\.admin-body\.admin-v2\.lumi-admin-standalone \.pwa-admin-tabbar \{.*?\.admin-body\.admin-v2\.lumi-admin-standalone \.pwa-admin-sr-only \{', re.S)
          css, count = pattern.subn(replacement, css, count=1)
          if count != 1:
              raise SystemExit(f'Expected one legacy tabbar CSS block, replaced {count}')
          legacy_media = re.compile(r'\n  \.admin-body\.admin-v2\.lumi-admin-standalone \.pwa-admin-tabbar \{\n    right: max\(0px, calc\(\(100vw - 620px\) / 2\)\);\n    left: max\(0px, calc\(\(100vw - 620px\) / 2\)\);\n    border-right: 1px solid rgba\(79, 59, 53, 0\.1\);\n    border-left: 1px solid rgba\(79, 59, 53, 0\.1\);\n    border-radius: 18px 18px 0 0;\n  \}\n')
          css, media_count = legacy_media.subn('\n', css, count=1)
          if media_count != 1:
              raise SystemExit(f'Expected one legacy wide tabbar media block, replaced {media_count}')
          if 'pwa-admin-tabbar-height' in css or '.pwa-admin-tabbar' in css:
              raise SystemExit('Legacy PWA tabbar CSS remains')
          css_path.write_text(css, encoding='utf-8')

          test_path = Path('tests/pwa.spec.js')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace("test('standalone admin uses icon tabbar and quick-add action'", "test('standalone admin uses 21st-style toolbar dock and quick-add action'")
          test = test.replace('#pwa-admin-tabbar .pwa-admin-tabbar-button', '#pwa-admin-tabbar .pwa-admin-toolbar-button')
          test = test.replace('toHaveCount(5);', 'toHaveCount(6);', 1)
          old_last = "    await expect(buttons.nth(4)).toHaveAttribute('aria-label', 'Értesítések');"
          if old_last not in test:
              raise SystemExit('Expected PWA toolbar assertion block not found')
          test = test.replace(old_last, old_last + "\n    await expect(buttons.nth(5)).toHaveAttribute('aria-label', 'Áttekintés');", 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Verify toolbar source replacement
        run: |
          grep -q "pwa-admin-toolbar-dock" pwa-admin-shell.js
          grep -q "data-admin-v2-nav=\"attekintes\"" pwa-admin-shell.js
          grep -q "grid-template-columns: repeat(6, 44px);" src/admin-styles/95-pwa.css
          grep -q "pwa-admin-toolbar-button" tests/pwa.spec.js
          ! grep -q "\.pwa-admin-tabbar" src/admin-styles/95-pwa.css

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Update asset versions
        run: npm run assets:version

      - name: Run source and CSS checks
        run: npm run check

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Test admin regressions
        run: npm run test:admin

      - name: Test standalone PWA toolbar
        run: npx playwright test tests/pwa.spec.js

      - name: Remove temporary workflow and commit result
        run: |
          rm .github/workflows/chatgpt-test-21st-toolbar-dock.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'Replace PWA tabbar with 21st-style toolbar dock'
          git push origin HEAD:CHATGPT_TEST
