name: Redeploy current luminails.hu site

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Írd be: UJRATELEPITES"
        required: true
        type: string

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm recovery redeploy
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "UJRATELEPITES" ]]; then
            echo "::error::A megerősítés nem egyezik."
            exit 1
          fi

      - name: Checkout live repository
        uses: actions/checkout@v4

      - name: Validate live domain
        shell: bash
        run: grep -qx 'luminails.hu' CNAME

      - name: Prepare current Pages artifact
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/live-site"
          mkdir -p "$artifact_dir"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            ./ "$artifact_dir/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/live-site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
