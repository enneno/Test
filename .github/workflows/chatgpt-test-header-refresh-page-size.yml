name: Move refresh beside export and widen page size

on:
  push:
    branches: [CHATGPT_TEST]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch canonical source
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const jsPath = 'src/admin/05-admin-workspace-v2.js';
          let js = fs.readFileSync(jsPath, 'utf8');
          const oldJs = `            const exportGomb = tab === 'foglalasok'\n                ? document.getElementById('admin-foglalas-export')\n                : null;\n            if (pageActions && exportGomb) {\n                exportGomb.classList.remove('admin-kis-gomb');\n                exportGomb.classList.add('admin-v2-button', 'admin-v2-button-secondary');\n                pageActions.append(exportGomb);\n            }`;
          const newJs = `            const exportGomb = tab === 'foglalasok'\n                ? document.getElementById('admin-foglalas-export')\n                : null;\n            const frissitesGomb = tab === 'foglalasok'\n                ? document.getElementById('admin-foglalas-frissites')\n                : null;\n            if (pageActions && exportGomb) {\n                exportGomb.classList.remove('admin-kis-gomb');\n                exportGomb.classList.add('admin-v2-button', 'admin-v2-button-secondary');\n                pageActions.append(exportGomb);\n            }\n            if (pageActions && frissitesGomb) {\n                frissitesGomb.className = 'admin-v2-button admin-v2-button-secondary admin-v2-refresh-action';\n                pageActions.append(frissitesGomb);\n            }`;
          if (!js.includes(oldJs)) throw new Error('Expected booking page action block not found');
          js = js.replace(oldJs, newJs);
          fs.writeFileSync(jsPath, js);

          const cssPath = 'src/admin-styles/30-bookings.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          css = css.replace(/\n  \.admin-body\.admin-v2 #admin-panel-foglalasok #admin-foglalas-frissites \{\n    width: 34px;\n    min-width: 34px;\n    height: 34px;\n    min-height: 34px;\n    padding: 0;\n  \}\n  \.admin-body\.admin-v2 #admin-panel-foglalasok #admin-foglalas-frissites svg \{\n    width: 16px;\n    height: 16px;\n  \}\n/, '\n');
          const oldSize = `  .admin-body.admin-v2 #admin-panel-foglalasok .admin-pagination-size .admin-oldalmeret-select {\n    width: 54px;\n    min-width: 54px;\n    height: 34px;\n    min-height: 34px;\n    padding-left: 8px;\n  }`;
          const newSize = `  .admin-body.admin-v2 #admin-panel-foglalasok .admin-pagination-size .admin-oldalmeret-select {\n    width: 96px;\n    min-width: 96px;\n    height: 34px;\n    min-height: 34px;\n    padding-left: 10px;\n  }`;
          if (!css.includes(oldSize)) throw new Error('Expected compact page-size block not found');
          css = css.replace(oldSize, newSize);
          fs.writeFileSync(cssPath, css);
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify changes
        shell: bash
        run: |
          grep -q "admin-v2-refresh-action" src/admin/05-admin-workspace-v2.js
          grep -q "width: 96px" src/admin-styles/30-bookings.css
          ! grep -A6 "#admin-foglalas-frissites" src/admin-styles/30-bookings.css | grep -q "width: 34px"
      - name: Commit verified result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-test-header-refresh-page-size.yml
          git add -A
          git commit -m "Refine booking header actions"
          git push origin CHATGPT_TEST
