name: Fit CHATGPT_TEST picker and status text
on:
  push:
    branches: [CHATGPT_TEST]
    paths: ['.github/workflows/chatgpt-test-picker-status-fit.yml']
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - name: Patch canonical CSS
        run: |
          python -c "from pathlib import Path; p=Path('src/admin-styles/10-components.css'); s=p.read_text(); s=s.replace('--admin-ui-picker-icon-size: 15px;', '--admin-ui-picker-icon-size: 13px;', 1).replace('--admin-ui-picker-icon-gap: 5px;', '--admin-ui-picker-icon-gap: 4px;', 1); p.write_text(s)"
          python -c "from pathlib import Path; p=Path('src/admin-styles/30-bookings.css'); s=p.read_text(); s=s.replace('  height: 32px;\n  min-height: 32px;\n  padding: 0 10px 2px;', '  height: 34px;\n  min-height: 34px;\n  padding: 0 10px;', 1).replace('  padding: 0 28px 2px 10px;', '  padding: 0 28px 0 10px;', 1); p.write_text(s)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify
        run: |
          grep -q -- '--admin-ui-picker-icon-size: 13px;' src/admin-styles/10-components.css
          grep -q -- '--admin-ui-picker-icon-gap: 4px;' src/admin-styles/10-components.css
          grep -q 'height: 34px;' src/admin-styles/30-bookings.css
          grep -q 'padding: 0 10px;' src/admin-styles/30-bookings.css
          grep -q 'grid-template-columns: minmax(0, 1.7fr) minmax(0, .65fr) minmax(0, .65fr);' src/admin-styles/30-bookings.css
      - name: Commit
        run: |
          rm .github/workflows/chatgpt-test-picker-status-fit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin-styles/10-components.css src/admin-styles/30-bookings.css admin-v2.css admin/index.html .github/workflows/chatgpt-test-picker-status-fit.yml
          git commit -m "Give picker and status text enough native space"
          git push origin CHATGPT_TEST
