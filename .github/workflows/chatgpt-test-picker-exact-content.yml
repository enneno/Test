name: Fix CHATGPT_TEST picker exact content centering
on:
  push:
    branches: [CHATGPT_TEST]
    paths: ['.github/workflows/chatgpt-test-picker-exact-content.yml']
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - name: Patch exact content area
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('src/admin-styles/10-components.css'); s=p.read_text(); old='  width: 100%;\n  max-width: 100%;\n  min-width: 0;\n  margin: 0;\n  padding: 0 var(--admin-ui-picker-icon-zone) 0 0;'; new='  width: calc(100% - var(--admin-ui-picker-icon-zone));\n  max-width: calc(100% - var(--admin-ui-picker-icon-zone));\n  min-width: 0;\n  margin: 0;\n  padding: 0;'; assert old in s, 'webkit value geometry not found'; p.write_text(s.replace(old,new,1))"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify exact result
        shell: bash
        run: |
          python -c "from pathlib import Path; c=Path('src/admin-styles/10-components.css').read_text(); b=Path('src/admin-styles/30-bookings.css').read_text(); assert 'width: calc(100% - var(--admin-ui-picker-icon-zone));' in c; assert 'margin: 0 var(--admin-ui-picker-icon-zone) 0 0;' not in c; assert 'padding: 0 var(--admin-ui-picker-icon-zone) 0 0;' not in c; assert 'grid-template-columns: minmax(0, 1.7fr) minmax(0, .65fr) minmax(0, .65fr);' in b"
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/chatgpt-test-picker-exact-content.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin-styles/10-components.css admin-v2.css admin/index.html .github/workflows/chatgpt-test-picker-exact-content.yml
          git commit -m "Center picker values in exact content area"
          git push origin CHATGPT_TEST
