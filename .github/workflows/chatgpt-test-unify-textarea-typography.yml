name: Unify admin textarea typography

on:
  push:
    branches:
      - CHATGPT_TEST

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch canonical textarea typography
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/admin-styles/10-components.css')
          s = p.read_text()
          needle = '''.admin-body.admin-v2 :is(#admin-tartalom, #admin-bejelentkezes-panel) input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="date"]):not([type="time"]):not([type="month"]) {
  font-family: inherit;
  font-size: var(--admin-ui-input-font-size);
  font-weight: 400;
  line-height: var(--admin-ui-control-line-height);
}
'''
          replacement = '''.admin-body.admin-v2 :is(#admin-tartalom, #admin-bejelentkezes-panel) :is(
  input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="date"]):not([type="time"]):not([type="month"]),
  textarea
) {
  font-family: inherit;
  font-size: var(--admin-ui-input-font-size);
  font-weight: 400;
  line-height: var(--admin-ui-control-line-height);
}
'''
          if needle not in s:
              raise SystemExit('Canonical text input rule not found')
          p.write_text(s.replace(needle, replacement, 1))
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify textarea typography ownership
        shell: bash
        run: |
          grep -F 'textarea' src/admin-styles/10-components.css
          grep -F 'font-weight: 400;' src/admin-styles/10-components.css
      - name: Commit verified result
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-test-unify-textarea-typography.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify admin textarea typography" || exit 0
          git push origin CHATGPT_TEST
