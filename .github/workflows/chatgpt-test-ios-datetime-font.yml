name: Apply CHATGPT_TEST iOS datetime font sizing

on:
  push:
    branches: [CHATGPT_TEST]

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Patch canonical booking CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/admin-styles/30-bookings.css')
          s = p.read_text()

          marker1 = '''  overflow: hidden;\n  text-align: left;\n  white-space: nowrap;\n}\n.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(input[type="date"], input[type="time"])::-webkit-datetime-edit,'''
          repl1 = '''  overflow: hidden;\n  font-size: 7px;\n  line-height: 1;\n  text-align: left;\n  white-space: nowrap;\n}\n.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(input[type="date"], input[type="time"])::-webkit-datetime-edit,'''
          if marker1 not in s:
              raise SystemExit('date-and-time value marker not found')
          s = s.replace(marker1, repl1, 1)

          marker2 = '''  margin: 0;\n  padding: 0;\n}\n.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto input[type="date"] {\n  background-image: var(--booking-icon-calendar);\n}'''
          repl2 = '''  margin: 0;\n  padding: 0;\n  font-size: 7px;\n  line-height: 1;\n}\n.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(\n  input[type="date"]::-webkit-datetime-edit-year-field,\n  input[type="date"]::-webkit-datetime-edit-month-field,\n  input[type="date"]::-webkit-datetime-edit-day-field,\n  input[type="date"]::-webkit-datetime-edit-text,\n  input[type="time"]::-webkit-datetime-edit-hour-field,\n  input[type="time"]::-webkit-datetime-edit-minute-field,\n  input[type="time"]::-webkit-datetime-edit-ampm-field,\n  input[type="time"]::-webkit-datetime-edit-text\n) {\n  font-size: 7px;\n  line-height: 1;\n}\n.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto input[type="date"] {\n  background-image: var(--booking-icon-calendar);\n}'''
          if marker2 not in s:
              raise SystemExit('datetime edit marker not found')
          s = s.replace(marker2, repl2, 1)
          p.write_text(s)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Commit canonical fix and remove workflow
        shell: bash
        run: |
          rm .github/workflows/chatgpt-test-ios-datetime-font.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin-styles/30-bookings.css admin-v2.css admin/index.html .github/workflows/chatgpt-test-ios-datetime-font.yml
          git commit -m 'Size iOS datetime inner text in canonical booking CSS'
          git push origin HEAD:CHATGPT_TEST
