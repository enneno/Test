name: CHATGPT TEST booking UI fix

on:
  push:
    branches:
      - CHATGPT_TEST

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compact card and picker containment fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/admin-styles/30-bookings.css')
          css = path.read_text(encoding='utf-8')
          original = css

          old = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya:not(.admin-foglalas-kartya-nyitott):not(.szerkeszt) .admin-db-kartya-fej {
  height: 96px;
  min-height: 96px;
}'''
          new = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya:not(.admin-foglalas-kartya-nyitott):not(.szerkeszt) .admin-db-kartya-fej {
  height: 78px;
  min-height: 78px;
}
.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya:not(.admin-foglalas-kartya-nyitott):not(.szerkeszt) .admin-foglalas-idopont {
  top: 13px;
}
.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya:not(.admin-foglalas-kartya-nyitott):not(.szerkeszt) .admin-foglalas-vezerlok {
  transform: translateY(-5px);
}'''
          if old not in css:
              raise SystemExit('Collapsed booking header block not found')
          css = css.replace(old, new, 1)

          old = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo {
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  gap: 5px;'''
          new = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo {
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  gap: 5px;'''
          if old not in css:
              raise SystemExit('Editor field block not found')
          css = css.replace(old, new, 1)

          marker = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo:has([data-idopont-mezo="date"]),
.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo-szeles {
  grid-column: 1 / -1;
}'''
          replacement = marker + '''
.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo:has(input[type="date"]),
.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo:has(input[type="time"]) {
  overflow: hidden;
}'''
          if marker not in css:
              raise SystemExit('Date full-width ownership block not found')
          css = css.replace(marker, replacement, 1)

          old = '''  inline-size: 100%;
  width: 100%;
  max-inline-size: 100%;
  max-width: 100%;
  min-inline-size: 0;
  min-width: 0;
  height: 42px;
  min-height: 42px;
  padding: 0 32px 0 10px;'''
          new = '''  inline-size: calc(100% - 1px);
  width: calc(100% - 1px);
  max-inline-size: calc(100% - 1px);
  max-width: calc(100% - 1px);
  min-inline-size: 0;
  min-width: 0;
  height: 38px;
  min-height: 38px;
  padding: 0 28px 0 8px;'''
          if old not in css:
              raise SystemExit('Native date/time sizing block not found')
          css = css.replace(old, new, 1)

          old = '''  font-size: 13px;
  font-weight: 720;
  line-height: 1;
  text-align: left;
}'''
          new = '''  font-size: 12px;
  font-weight: 720;
  line-height: 1;
  text-align: left;
}'''
          if old not in css:
              raise SystemExit('Native date/time typography block not found')
          css = css.replace(old, new, 1)

          old = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(input[type="date"], input[type="time"])::-webkit-date-and-time-value {
  min-width: 0;
  margin: 0;
  padding: 0;
  overflow: hidden;
  text-align: left;
  white-space: nowrap;
}'''
          new = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(input[type="date"], input[type="time"])::-webkit-date-and-time-value {
  display: block;
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-size: inherit;
  text-align: left;
  text-overflow: clip;
  white-space: nowrap;
}'''
          if old not in css:
              raise SystemExit('WebKit date/time value block not found')
          css = css.replace(old, new, 1)

          old = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(input[type="date"], input[type="time"])::-webkit-datetime-edit,
.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(input[type="date"], input[type="time"])::-webkit-datetime-edit-fields-wrapper {
  min-width: 0;
  margin: 0;
  padding: 0;
}'''
          new = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(input[type="date"], input[type="time"])::-webkit-datetime-edit,
.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(input[type="date"], input[type="time"])::-webkit-datetime-edit-fields-wrapper {
  box-sizing: border-box;
  width: 100%;
  max-width: 100%;
  min-width: 0;
  margin: 0;
  padding: 0;
  overflow: hidden;
  white-space: nowrap;
}'''
          if old not in css:
              raise SystemExit('WebKit datetime edit block not found')
          css = css.replace(old, new, 1)

          old = '''  .admin-body.admin-v2 #admin-panel-foglalasok .admin-db-kartya-fej { min-height: 96px; gap: 4px 10px; padding: 8px 0; }'''
          new = '''  .admin-body.admin-v2 #admin-panel-foglalasok .admin-db-kartya-fej { min-height: 78px; gap: 4px 10px; padding: 6px 0; }'''
          if old not in css:
              raise SystemExit('Mobile booking header rule not found')
          css = css.replace(old, new, 1)

          if css == original:
              raise SystemExit('No CSS changes produced')
          path.write_text(css, encoding='utf-8')
          PY

      - name: Build generated assets
        run: npm run build

      - name: Refresh asset versions
        run: npm run assets:version

      - name: Verify project
        run: npm run check

      - name: Verify booking admin regressions
        run: npx playwright test tests/admin-v2-regressions.spec.js

      - name: Commit verified CHATGPT_TEST changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/chatgpt-test-booking-ui-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add src/admin-styles/30-bookings.css admin-v2.css admin/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "Compact booking cards and contain iOS pickers"
          git push origin HEAD:CHATGPT_TEST
