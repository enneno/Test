name: One-time booking picker containment fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps msedge

      - name: Apply picker containment fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/admin-styles/30-bookings.css')
          s = p.read_text(encoding='utf-8')

          old = 'grid-template-columns: repeat(2, minmax(0, 1fr));'
          new = 'grid-template-columns: minmax(0, 1.35fr) minmax(0, .825fr) minmax(0, .825fr);'
          if old not in s:
              raise SystemExit('editor grid not found')
          s = s.replace(old, new, 1)

          old = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo:has([data-idopont-mezo="date"]),
          .admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo-szeles {
            grid-column: 1 / -1;
          }'''
          new = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo-szeles {
            grid-column: 1 / -1;
          }'''
          if old not in s:
              raise SystemExit('date full-width rule not found')
          s = s.replace(old, new, 1)

          old = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo {
            min-width: 0;
            gap: 5px;'''
          new = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            gap: 5px;
            overflow: hidden;'''
          if old not in s:
              raise SystemExit('editor field rule not found')
          s = s.replace(old, new, 1)

          start = s.index('.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto input[type="date"],')
          end = s.index('.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto input[type="date"] {', start)
          replacement = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto input[type="date"],
          .admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto input[type="time"] {
            position: relative;
            display: block;
            box-sizing: border-box;
            inline-size: 100%;
            width: 100%;
            max-inline-size: 100%;
            max-width: 100%;
            min-inline-size: 0;
            min-width: 0;
            height: 42px;
            min-height: 42px;
            padding: 0 27px 0 7px;
            overflow: hidden;
            appearance: none;
            -webkit-appearance: none;
            border: 1px solid var(--admin-v2-border);
            border-radius: 12px;
            color: var(--admin-v2-ink);
            background-color: var(--admin-v2-surface);
            background-position: right 8px center;
            background-repeat: no-repeat;
            background-size: 14px 14px;
            box-shadow: 0 1px 2px rgba(67, 42, 35, .04);
            font-family: inherit;
            font-size: 11px;
            font-weight: 720;
            letter-spacing: -.015em;
            line-height: 1;
            text-align: center;
          }
          .admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(input[type="date"], input[type="time"])::-webkit-date-and-time-value {
            min-width: 0;
            padding: 0;
            text-align: center;
          }
          .admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(input[type="date"], input[type="time"])::-webkit-datetime-edit,
          .admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto :is(input[type="date"], input[type="time"])::-webkit-datetime-edit-fields-wrapper {
            min-width: 0;
            padding: 0;
          }
          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')

          t = Path('tests/admin-v2-regressions.spec.js')
          ts = t.read_text(encoding='utf-8')
          marker = "a foglalás szerkesztő date/time mezői egy sorban és a saját oszlopukban maradnak"
          if marker not in ts:
              ts += '''\n\ntest('a foglalás szerkesztő date/time mezői egy sorban és a saját oszlopukban maradnak', async () => {\n    const source = fs.readFileSync(path.resolve(__dirname, '..', 'src', 'admin-styles', '30-bookings.css'), 'utf8');\n    expect(source).toContain('grid-template-columns: minmax(0, 1.35fr) minmax(0, .825fr) minmax(0, .825fr);');\n    expect(source).not.toContain('.admin-mezo:has([data-idopont-mezo="date"]),');\n    expect(source).toContain('max-inline-size: 100%;');\n    expect(source).toContain('min-inline-size: 0;');\n    expect(source).toContain('-webkit-appearance: none;');\n});\n'''
              t.write_text(ts, encoding='utf-8')
          PY

      - name: Verify admin
        run: npm run verify:admin

      - name: Commit verified fix
        run: |
          rm -f .github/workflows/one-time-booking-picker-overflow-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Contain booking date and time pickers"
          git push origin HEAD:main
