name: Fix booking control grid

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - .github/workflows/chatgpt-fix-booking-control-grid.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0
      - name: Apply canonical fix and regression test
        run: echo '' | base64 -d > /tmp/fix.py && python /tmp/fix.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Version assets
        run: npm run assets:version
      - name: Check
        run: npm run check
      - name: Install browsers
        run: |
          npx playwright install --with-deps msedge
          npx playwright install --with-deps webkit
      - name: Run affected admin tests
        run: npx playwright test tests/admin-v2-regressions.spec.js tests/admin-booking-css-architecture.spec.js tests/admin-production-redesign.spec.js tests/admin-shared-components.spec.js
      - name: Verify exact card alignment in WebKit
        run: echo '' | base64 -d > /tmp/verify.js && node /tmp/verify.js
      - name: Commit verified fix and cleanup temporary workflows
        run: |
          rm -f .github/workflows/chatgpt-debug-booking-alignment.yml
          rm -f .github/workflows/chatgpt-fix-booking-control-grid.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix booking card vertical alignment"
          git push origin CHATGPT_TEST
