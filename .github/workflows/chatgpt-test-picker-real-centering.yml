name: Fix CHATGPT_TEST picker real centering

on:
  push:
    branches:
      - CHATGPT_TEST

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - name: Patch picker geometry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/admin-styles/10-components.css')
          s = p.read_text()
          old = '  padding: 0 var(--admin-ui-picker-icon-zone) 0 5px;'
          new = '  padding: 0;'
          if old not in s:
              raise SystemExit('picker padding anchor not found')
          s = s.replace(old, new, 1)

          old_value = '  width: 100%;\n  max-width: 100%;\n  min-width: 0;\n  margin: 0;\n  padding: 0;\n  display: flex;'
          new_value = '  width: calc(100% - var(--admin-ui-picker-icon-zone));\n  max-width: calc(100% - var(--admin-ui-picker-icon-zone));\n  min-width: 0;\n  margin: 0 var(--admin-ui-picker-icon-zone) 0 0;\n  padding: 0;\n  display: flex;'
          if old_value not in s:
              raise SystemExit('webkit value anchor not found')
          s = s.replace(old_value, new_value, 1)
          p.write_text(s)

          p = Path('src/admin-styles/30-bookings.css')
          s = p.read_text()
          old_grid = 'grid-template-columns: minmax(0, 1.7fr) minmax(0, .65fr) minmax(0, .65fr);'
          new_grid = 'grid-template-columns: minmax(0, 1.9fr) minmax(0, .55fr) minmax(0, .55fr);'
          if old_grid not in s:
              raise SystemExit('grid anchor not found')
          p.write_text(s.replace(old_grid, new_grid, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify
        shell: bash
        run: |
          grep -F 'width: calc(100% - var(--admin-ui-picker-icon-zone));' src/admin-styles/10-components.css
          grep -F 'margin: 0 var(--admin-ui-picker-icon-zone) 0 0;' src/admin-styles/10-components.css
          grep -F 'grid-template-columns: minmax(0, 1.9fr) minmax(0, .55fr) minmax(0, .55fr);' src/admin-styles/30-bookings.css
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/chatgpt-test-picker-real-centering.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Center picker values in actual content area"
          git push origin CHATGPT_TEST
