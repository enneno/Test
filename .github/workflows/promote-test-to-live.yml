name: Promote tested site to luminails.hu

on:
  workflow_dispatch:
    inputs:
      test_ref:
        description: "Teszt ág vagy commit (alapértelmezés: main)"
        required: true
        default: main
        type: string
      confirmation:
        description: "Írd be: ELESITES"
        required: true
        type: string

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  promote:
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm live promotion
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$CONFIRMATION" != "ELESITES" ]]; then
            echo "::error::A megerősítés nem egyezik."
            exit 1
          fi

      - name: Checkout live repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: live
          fetch-depth: 0

      - name: Checkout tested repository
        uses: actions/checkout@v4
        with:
          repository: enneno/enneno.github.io
          ref: ${{ inputs.test_ref }}
          path: tested
          persist-credentials: false

      - name: Record tested commit
        id: source
        shell: bash
        run: echo "sha=$(git -C tested rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful TEST deployment
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          runs_file="${RUNNER_TEMP}/test-pages-runs.json"
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/enneno/enneno.github.io/actions/workflows/pages.yml/runs?head_sha=${SOURCE_SHA}&status=completed&per_page=20" \
            --output "$runs_file"
          if ! jq -e --arg sha "$SOURCE_SHA" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            "$runs_file" >/dev/null; then
            echo "::error::Ehhez a TEST commithoz nincs sikeres tesztoldal-telepítés."
            exit 1
          fi

      - name: Validate source and live domain
        shell: bash
        run: |
          if [[ -e tested/CNAME ]]; then
            echo "::error::A teszt tároló nem tartalmazhat CNAME fájlt."
            exit 1
          fi
          grep -qx 'luminails.hu' live/CNAME

      - name: Replace live application with tested content
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            --exclude='node_modules/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            tested/ live/
          grep -qx 'luminails.hu' live/CNAME

      - name: Update live main
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git -C live config user.name "github-actions[bot]"
          git -C live config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C live add -A
          if git -C live diff --cached --quiet; then
            echo "Az éles tároló már ezt a verziót tartalmazza."
          else
            git -C live commit -m "release: promote tested site ${SOURCE_SHA:0:12}"
            git -C live push origin HEAD:main
          fi
          echo "Promoted TEST commit: ${SOURCE_SHA}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare Pages artifact
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/live-site"
          mkdir -p "$artifact_dir"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            live/ "$artifact_dir/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/live-site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
