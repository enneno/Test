name: Compact admin controls build

on:
  push:
    branches:
      - admin-compact-controls

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Refresh asset versions
        run: npm run assets:version

      - name: Verify site and admin component system
        run: npm run check

      - name: Commit generated admin assets
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v2.css admin/index.html
          if git diff --cached --quiet; then
            echo "No admin generated changes to commit."
            exit 0
          fi
          git commit -m "Build compact admin controls"
          git push origin HEAD:admin-compact-controls
