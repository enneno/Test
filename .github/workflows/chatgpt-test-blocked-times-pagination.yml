name: Blocked times pagination verification

on:
  push:
    branches:
      - CHATGPT_TEST

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply pagination patch
        shell: bash
        run: |
          echo '   yZXMiPk5pbmNzIGvDvGzDtm4gZmVsdmV0dCBmb2dsYWx0IGlkwZE8L3A+JzsKICAgICAgICAgICAgdGlsdGFzTGFwb3pvUmVuZGVyZWxlc2UoKTsKICAgICAgICAgICAgcmV0dXJuOwogICAgICAgIH0KCiAgICAgICAgb2xkYWxFbGVtZWs   rw6l6aSBmb2dsYWx0IGlkwZEgbWVudHZlLiBBIHN0w6F0dXN6w6F0IGEgRm9nbGFsYXNvayBuw6l6ZXRiZW4gbcOzZG9zw610aGF0b2QuJyk7XG4gICAgICAgIGFsbGFwb3QudGlsdGFzT2xkYWwgPSAxO1xuICAgICAgICB0aWx0YXNv   gZW5jb2Rpbmc9J3V0Zi04JykK' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Version assets
        run: npm run assets:version

      - name: Check
        run: npm run check

      - name: Install Edge
        run: npx playwright install --with-deps msedge

      - name: Affected admin tests
        run: npx playwright test tests/admin-blocked-times-pagination.spec.js tests/admin-blocked-times-mobile.spec.js tests/admin-shared-components.spec.js tests/admin-v2-regressions.spec.js

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-test-blocked-times-pagination.yml
          git add src/admin/00-bootstrap-auth-calendar.js src/admin/40-availability-settings.js admin/index.html tests/admin-blocked-times-pagination.spec.js admin-v2.css admin-supabase.js
          git add -u
          git commit -m "Paginate blocked times with shared controls"
          git push origin HEAD:CHATGPT_TEST
