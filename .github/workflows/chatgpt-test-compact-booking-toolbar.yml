name: Compact booking toolbar controls
on:
  push:
    paths:
      - '.github/workflows/chatgpt-test-compact-booking-toolbar.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch canonical mobile booking toolbar
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/admin-styles/30-bookings.css';
          let s = fs.readFileSync(p, 'utf8');
          const rep = (a, b) => {
            if (!s.includes(a)) throw new Error('Missing expected CSS block:\n' + a);
            s = s.replace(a, b);
          };
          rep(`@container admin-workspace (max-width: 480px) {
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-pagination-button span { display: none; }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-pagination-button { width: 36px; padding: 0; }
          `, `@container admin-workspace (max-width: 480px) {
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-kereses-mezo > label,
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-statusz-szuro-mezo > span { display: none; }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-kereses-mezo {
              grid-template-rows: var(--admin-ui-field-height);
              gap: 0;
            }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-statusz-szuro-mezo {
              grid-template-rows: var(--admin-ui-choice-height);
            }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-pagination-button span { display: none; }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-pagination-button {
              width: 30px;
              min-width: 30px;
              height: 30px;
              min-height: 30px;
              padding: 0;
            }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-pagination-page {
              min-width: 40px;
              height: 30px;
              padding-inline: 6px;
            }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-lapozo-nav { padding: 2px; }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-lapozo {
              min-height: 36px;
              gap: 6px 8px;
            }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-lapozo-felso { margin: 6px 0; }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-pagination-size .admin-oldalmeret-select {
              width: 54px;
              min-width: 54px;
              height: 34px;
              min-height: 34px;
              padding-left: 8px;
            }
            .admin-body.admin-v2 #admin-panel-foglalasok #admin-foglalas-frissites {
              width: 34px;
              min-width: 34px;
              height: 34px;
              min-height: 34px;
              padding: 0;
            }
            .admin-body.admin-v2 #admin-panel-foglalasok #admin-foglalas-frissites svg {
              width: 16px;
              height: 16px;
            }
          `);
          rep(`  .admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-attekintes {
            align-items: center;
            flex-flow: row wrap;
            gap: 8px;
            padding-block: 8px 10px;
          }
          `, `  .admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-attekintes {
            align-items: center;
            flex-flow: row wrap;
            min-height: 40px;
            gap: 6px;
            padding-block: 5px 6px;
          }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-nezetvalto {
              width: 138px;
              gap: 2px;
              padding: 2px;
            }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-nezet-gomb {
              height: 30px;
              min-height: 30px;
              gap: 5px;
              padding-inline: 8px;
            }
            .admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-nezet-gomb::before {
              width: 12px;
              height: 12px;
              flex-basis: 12px;
              -webkit-mask-size: 12px 12px;
              mask-size: 12px 12px;
            }
          `);
          rep(`  .admin-body.admin-v2 #admin-panel-foglalasok .admin-panel-akciok-keresessel {
            grid-template-columns: minmax(0, 1fr) 112px;
            grid-template-areas: "search status";
            gap: 9px;
            padding-bottom: 12px;
          }
          `, `  .admin-body.admin-v2 #admin-panel-foglalasok .admin-panel-akciok-keresessel {
            grid-template-columns: minmax(0, 1fr) 112px;
            grid-template-areas: "search status";
            gap: 9px;
            margin-bottom: 5px;
            padding-bottom: 8px;
          }
          `);
          fs.writeFileSync(p, s);
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify compact toolbar
        shell: bash
        run: |
          grep -q 'width: 138px' src/admin-styles/30-bookings.css
          grep -q 'width: 30px' src/admin-styles/30-bookings.css
          grep -q 'grid-template-rows: var(--admin-ui-field-height)' src/admin-styles/30-bookings.css
          grep -q '#admin-foglalas-frissites' src/admin-styles/30-bookings.css
      - name: Commit verified result
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-test-compact-booking-toolbar.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/admin-styles/30-bookings.css admin-v2.css admin/index.html .github/workflows/chatgpt-test-compact-booking-toolbar.yml
          git commit -m 'Compact mobile booking toolbar' || exit 0
          git push origin HEAD:CHATGPT_TEST
