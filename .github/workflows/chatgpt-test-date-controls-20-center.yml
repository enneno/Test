name: Tune CHATGPT_TEST shared date controls
on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - '.github/workflows/chatgpt-test-date-controls-20-center.yml'
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - name: Update only shared native picker rule
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/admin-styles/10-components.css')
          s = p.read_text(encoding='utf-8')
          start_marker = '/* Shared native date/time/month controls: one visual owner for the entire admin. */'
          end_marker = '.admin-body.admin-v2 :is(#admin-tartalom, #admin-bejelentkezes-panel) textarea {'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('shared picker block not found')
          before, block, after = s[:start], s[start:end], s[end:]
          if block.count('font-size: 16px;') != 4:
              raise SystemExit(f'unexpected 16px count in shared picker block: {block.count("font-size: 16px;")}')
          if block.count('text-align: left;') != 2:
              raise SystemExit(f'unexpected left-align count in shared picker block: {block.count("text-align: left;")}')
          block = block.replace('font-size: 16px;', 'font-size: 20px;')
          block = block.replace('text-align: left;', 'text-align: center;')
          p.write_text(before + block + after, encoding='utf-8')
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify targeted result
        shell: python
        run: |
          from pathlib import Path
          s = Path('src/admin-styles/10-components.css').read_text(encoding='utf-8')
          start = s.find('/* Shared native date/time/month controls: one visual owner for the entire admin. */')
          end = s.find('.admin-body.admin-v2 :is(#admin-tartalom, #admin-bejelentkezes-panel) textarea {', start)
          block = s[start:end]
          assert block.count('font-size: 20px;') == 4
          assert 'font-size: 16px;' not in block
          assert block.count('text-align: center;') == 2
          assert 'text-align: left;' not in block
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/chatgpt-test-date-controls-20-center.yml
          git add src/admin-styles/10-components.css admin-v2.css admin/index.html .github/workflows/chatgpt-test-date-controls-20-center.yml
          git commit -m "Center shared admin date controls at 20px"
          git push origin HEAD:CHATGPT_TEST
