name: Retry CHATGPT_TEST PWA select typography at 14px

on:
  push:
    branches:
      - CHATGPT_TEST

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch PWA select font size only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/admin-styles/95-pwa.css')
          s = p.read_text()
          old = "    font-size: 11px;\n    -webkit-text-size-adjust: none;"
          new = "    font-size: 14px;\n    -webkit-text-size-adjust: none;"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one PWA select font block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify targeted typography
        shell: bash
        run: |
          grep -A6 'lumi-admin-standalone #admin-tartalom select' src/admin-styles/95-pwa.css | grep -q 'font-size: 14px;'
          grep -q 'font-size: 20px;' src/admin-styles/10-components.css
      - name: Commit verified result
        shell: bash
        run: |
          rm -f .github/workflows/chatgpt-test-pwa-select-14.yml
          rm -f .github/workflows/chatgpt-test-pwa-select-14-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Set PWA select typography to 14px"
          git push origin CHATGPT_TEST
