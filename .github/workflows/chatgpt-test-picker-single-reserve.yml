name: Fix CHATGPT_TEST picker single reserve
on:
  push:
    branches: [CHATGPT_TEST]
    paths: ['.github/workflows/chatgpt-test-picker-single-reserve.yml']
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - name: Patch picker geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          c = Path('src/admin-styles/10-components.css')
          s = c.read_text()
          s = s.replace('  width: calc(100% - var(--admin-ui-picker-icon-zone));\n  max-width: calc(100% - var(--admin-ui-picker-icon-zone));\n  min-width: 0;\n  margin: 0 var(--admin-ui-picker-icon-zone) 0 0;\n  padding: 0;', '  width: 100%;\n  max-width: 100%;\n  min-width: 0;\n  margin: 0;\n  padding: 0 var(--admin-ui-picker-icon-zone) 0 0;', 1)
          c.write_text(s)
          b = Path('src/admin-styles/30-bookings.css')
          t = b.read_text().replace('grid-template-columns: minmax(0, 1.9fr) minmax(0, .55fr) minmax(0, .55fr);', 'grid-template-columns: minmax(0, 1.7fr) minmax(0, .65fr) minmax(0, .65fr);', 1)
          b.write_text(t)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          c = Path('src/admin-styles/10-components.css').read_text()
          b = Path('src/admin-styles/30-bookings.css').read_text()
          assert 'padding: 0 var(--admin-ui-picker-icon-zone) 0 0;' in c
          assert 'width: calc(100% - var(--admin-ui-picker-icon-zone));' not in c
          assert 'margin: 0 var(--admin-ui-picker-icon-zone) 0 0;' not in c
          assert 'grid-template-columns: minmax(0, 1.7fr) minmax(0, .65fr) minmax(0, .65fr);' in b
          PY
      - name: Commit
        run: |
          rm .github/workflows/chatgpt-test-picker-single-reserve.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin-styles/10-components.css src/admin-styles/30-bookings.css admin-v2.css admin/index.html .github/workflows/chatgpt-test-picker-single-reserve.yml
          git commit -m "Center picker values with one icon reserve"
          git push origin CHATGPT_TEST
