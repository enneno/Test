name: Tune CHATGPT_TEST editor widths and status baseline
on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - '.github/workflows/chatgpt-test-widths-status-baseline.yml'
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - name: Apply targeted canonical CSS changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/admin-styles/30-bookings.css')
          s = p.read_text(encoding='utf-8')
          old_grid = 'grid-template-columns: minmax(0, 1.25fr) minmax(0, .875fr) minmax(0, .875fr);'
          new_grid = 'grid-template-columns: minmax(0, 1.5fr) minmax(0, .75fr) minmax(0, .75fr);'
          assert s.count(old_grid) == 1
          s = s.replace(old_grid, new_grid, 1)
          old_common = '  padding: 0 10px;\n  appearance: none;'
          new_common = '  padding: 0 10px 2px;\n  appearance: none;'
          assert s.count(old_common) == 1
          s = s.replace(old_common, new_common, 1)
          old_edit = '  padding: 0 28px 0 10px;\n  background-image:'
          new_edit = '  padding: 0 28px 2px 10px;\n  background-image:'
          assert s.count(old_edit) == 1
          s = s.replace(old_edit, new_edit, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify targeted result
        run: |
          grep -F 'grid-template-columns: minmax(0, 1.5fr) minmax(0, .75fr) minmax(0, .75fr);' src/admin-styles/30-bookings.css
          grep -F 'padding: 0 10px 2px;' src/admin-styles/30-bookings.css
          grep -F 'padding: 0 28px 2px 10px;' src/admin-styles/30-bookings.css
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/chatgpt-test-widths-status-baseline.yml
          git add src/admin-styles/30-bookings.css admin-v2.css admin/index.html .github/workflows/chatgpt-test-widths-status-baseline.yml
          git commit -m "Tune booking editor widths and status baseline"
          git push origin HEAD:CHATGPT_TEST
