name: Debug booking overflow

on:
  push:
    branches:
      - refactor/admin-css-ownership

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps msedge

      - name: Inject overflow diagnostics into test copy
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/admin-production-redesign.spec.js')
          text = path.read_text(encoding='utf-8')
          anchor = '        expect(mobileMetrics.overflow).toBeLessThanOrEqual(1);\n'
          diagnostic = '''        if (mobileMetrics.overflow > 1) {\n            const overflowers = await page.evaluate(() => Array.from(document.querySelectorAll('body *')).map((element) => {\n                const rect = element.getBoundingClientRect();\n                const style = getComputedStyle(element);\n                return {\n                    tag: element.tagName,\n                    id: element.id,\n                    className: typeof element.className === 'string' ? element.className : '',\n                    left: Math.round(rect.left * 10) / 10,\n                    right: Math.round(rect.right * 10) / 10,\n                    width: Math.round(rect.width * 10) / 10,\n                    display: style.display,\n                    position: style.position,\n                    overflowX: style.overflowX\n                };\n            }).filter((item) => item.display !== 'none' && (item.right > window.innerWidth + 1 || item.left < -1)));\n            console.log('BOOKING_OVERFLOWERS=' + JSON.stringify(overflowers));\n        }\n'''
          if anchor not in text:
              raise SystemExit('diagnostic anchor missing')
          path.write_text(text.replace(anchor, diagnostic + anchor, 1), encoding='utf-8')
          PY

      - name: Run failing booking mobile test
        run: |
          npx playwright test tests/admin-production-redesign.spec.js --grep "mobile: the drawer, touch targets and booking page fit the viewport" --reporter=line
