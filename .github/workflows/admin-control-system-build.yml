name: Admin control system build

on:
  push:
    branches:
      - admin-control-system
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Refresh asset versions
        run: npm run assets:version

      - name: Verify site, bundle ownership and admin component system
        run: npm run check

      - name: Commit generated assets
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v2.css admin/index.html
          if git diff --cached --quiet; then
            echo "No admin generated changes to commit."
            exit 0
          fi
          git commit -m "Build canonical admin control system"
          git push origin HEAD:admin-control-system
