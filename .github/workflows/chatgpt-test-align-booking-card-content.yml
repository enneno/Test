name: Align booking card content

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - .github/workflows/chatgpt-test-align-booking-card-content.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Normalize manual and online booking identity rows
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/admin/10-bookings-events.js')
          text = path.read_text(encoding='utf-8')
          label = 'K\u00e9zzel felvett id\u0151'
          old_label = '<span class="admin-kartya-tipus">' + label + '</span>'
          new_label = '<p class="admin-kartya-tipus admin-foglalas-azonosito" aria-label="' + label + '"><code>' + label + '</code></p>'
          old_blank = '<p class="admin-foglalas-rovid-szolgaltatas" aria-hidden="true"></p>'
          new_blank = '<p class="admin-foglalas-rovid-szolgaltatas" aria-hidden="true">&nbsp;</p>'
          if text.count(old_label) != 1:
              raise SystemExit('Manual booking label not found exactly once')
          if text.count(old_blank) != 1:
              raise SystemExit('Manual booking spacer row not found exactly once')
          text = text.replace(old_label, new_label, 1)
          text = text.replace(old_blank, new_blank, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify normalized markup
        run: |
          grep -F 'admin-kartya-tipus admin-foglalas-azonosito' src/admin/10-bookings-events.js
          grep -F 'aria-hidden="true">&nbsp;</p>' src/admin/10-bookings-events.js
          if grep -F '<span class="admin-kartya-tipus">' src/admin/10-bookings-events.js; then exit 1; fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Version assets
        run: npm run assets:version

      - name: Check
        run: npm run check

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Run affected admin tests
        run: npx playwright test tests/admin-v2-regressions.spec.js tests/admin-booking-css-architecture.spec.js tests/admin-production-redesign.spec.js

      - name: Commit verified fix and remove temporary workflow
        run: |
          rm -f .github/workflows/chatgpt-test-align-booking-card-content.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align online and manual booking cards"
          git push origin CHATGPT_TEST
