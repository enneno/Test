name: Fix CHATGPT_TEST input and PWA select typography

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - '.github/workflows/chatgpt-test-input-pwa-select-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch canonical typography
        run: |
          python - <<'PY'
          from pathlib import Path

          cpath = Path('src/admin-styles/10-components.css')
          c = cpath.read_text()
          old = '  --admin-ui-placeholder-font-size: 11px;\n'
          new = '  --admin-ui-placeholder-font-size: 11px;\n  --admin-ui-input-font-size: 12px;\n'
          assert old in c and '--admin-ui-input-font-size:' not in c
          c = c.replace(old, new, 1)

          old = '''input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="date"]):not([type="time"]):not([type="month"]) {\n  font-size: 12px;\n}'''
          new = '''input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="date"]):not([type="time"]):not([type="month"]) {\n  font-size: var(--admin-ui-input-font-size);\n}'''
          assert old in c
          c = c.replace(old, new, 1)

          marker = '/* Shared native date/time/month controls: one visual owner for the entire admin. */'
          browser = '''@media (display-mode: browser) and (max-width: 768px) {\n  .admin-body.admin-v2 {\n    --admin-ui-input-font-size: 16px;\n  }\n}\n\n'''
          assert marker in c and '--admin-ui-input-font-size: 16px;' not in c
          c = c.replace(marker, browser + marker, 1)
          cpath.write_text(c)

          ppath = Path('src/admin-styles/95-pwa.css')
          p = ppath.read_text()
          old = '''@media (max-width: 768px) {\n  .admin-body.admin-v2.lumi-admin-standalone #admin-tartalom input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="date"]):not([type="time"]):not([type="month"]),\n  .admin-body.admin-v2.lumi-admin-standalone #admin-tartalom textarea,\n  .admin-body.admin-v2.lumi-admin-standalone #admin-tartalom select,\n  .admin-body.admin-v2.lumi-admin-standalone #admin-tartalom .admin-db-statusz {\nfont-size-adjust: none;\n  }\n}\n'''
          new = '''@media (max-width: 768px) {\n  .admin-body.admin-v2.lumi-admin-standalone #admin-tartalom select,\n  .admin-body.admin-v2.lumi-admin-standalone #admin-tartalom .admin-db-statusz,\n  .admin-body.admin-v2.lumi-admin-standalone #admin-tartalom .admin-oldalmeret-select {\n    font-size: 11px;\n    -webkit-text-size-adjust: none;\n    text-size-adjust: none;\n  }\n}\n'''
          assert old in p
          p = p.replace(old, new, 1)
          ppath.write_text(p)
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify typography
        run: |
          python - <<'PY'
          from pathlib import Path
          c = Path('src/admin-styles/10-components.css').read_text()
          p = Path('src/admin-styles/95-pwa.css').read_text()
          assert '--admin-ui-input-font-size: 12px;' in c
          assert '--admin-ui-input-font-size: 16px;' in c
          assert 'font-size: var(--admin-ui-input-font-size);' in c
          assert 'font-size: 11px;' in p
          assert '-webkit-text-size-adjust: none;' in p
          assert 'font-size: 20px;' in c
          print('input/PWA select typography verified')
          PY
      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-test-input-pwa-select-fix.yml
          git add src/admin-styles/10-components.css src/admin-styles/95-pwa.css admin-v2.css admin/index.html
          git add -u
          git commit -m "Fix browser input and PWA select typography"
          git push origin HEAD:CHATGPT_TEST
