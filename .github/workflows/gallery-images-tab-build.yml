name: Gallery images tab build

on:
  push:
    branches:
      - gallery-images-tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Refresh asset versions
        run: npm run assets:version

      - name: Verify site and admin CSS
        run: npm run check

      - name: Verify gallery workspace bundle
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const js = fs.readFileSync('admin-supabase.js', 'utf8');
          const css = fs.readFileSync('admin-v2.css', 'utf8');
          for (const token of ['data-lumi-cms-gallery-tab', 'Galéria képek', 'lumiCmsGalleryContext']) {
            if (!js.includes(token)) throw new Error('Missing gallery JS token: ' + token);
          }
          for (const token of ['data-lumi-cms-gallery-context="page"', 'data-lumi-cms-gallery-context="images"', 'cms-view-tab-gallery']) {
            if (!css.includes(token)) throw new Error('Missing gallery CSS token: ' + token);
          }
          NODE

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-supabase.js admin-v2.css admin/index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build dedicated gallery images tab"
          git push origin HEAD:gallery-images-tab
