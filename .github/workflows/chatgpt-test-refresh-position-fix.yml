name: Fix booking refresh position

on:
  push:
    branches: [CHATGPT_TEST]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch canonical booking renderer
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src/admin/10-bookings-events.js';
          let js = fs.readFileSync(path, 'utf8');
          const oldBlock = `    function foglalasLapozoRenderelese() {\n        const elemek = adminElemek();\n        const frissitesGomb = elemek.foglalasFrissites;\n        const htmlTartalom = foglalasLapozoHtml();\n        [elemek.foglalasLapozoFelso, elemek.foglalasLapozo].filter(Boolean).forEach(lapozo => {\n            lapozo.innerHTML = htmlTartalom;\n        });\n\n        const felsoJobbOldal = elemek.foglalasLapozoFelso?.querySelector('.admin-lapozo-jobb');\n        if (felsoJobbOldal && frissitesGomb) {\n            felsoJobbOldal.append(frissitesGomb);\n        }\n    }`;
          const newBlock = `    function foglalasLapozoRenderelese() {\n        const elemek = adminElemek();\n        const htmlTartalom = foglalasLapozoHtml();\n        [elemek.foglalasLapozoFelso, elemek.foglalasLapozo].filter(Boolean).forEach(lapozo => {\n            lapozo.innerHTML = htmlTartalom;\n        });\n    }`;
          if (!js.includes(oldBlock)) throw new Error('Expected pagination refresh relocation block not found');
          js = js.replace(oldBlock, newBlock);
          fs.writeFileSync(path, js);
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify refresh ownership
        shell: bash
        run: |
          ! grep -A12 "function foglalasLapozoRenderelese" src/admin/10-bookings-events.js | grep -q "frissitesGomb"
          grep -q "admin-v2-refresh-action" src/admin/05-admin-workspace-v2.js
          grep -q "admin-v2-refresh-action" admin-supabase.js
      - name: Commit verified result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-test-refresh-position-fix.yml
          git add -A
          git commit -m "Keep booking refresh in header"
          git push origin CHATGPT_TEST
