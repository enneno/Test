name: Final selected days mobile verification

on:
  push:
    branches:
      - CHATGPT_TEST
    paths:
      - .github/workflows/chatgpt-test-selected-days-mobile-final.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply changes
        run: python3 scripts/chatgpt-selected-days-mobile.py
      - name: Reject override hacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          code = re.sub(r'/\*.*?\*/', '', Path('src/admin-styles/70-availability.css').read_text(encoding='utf-8'), flags=re.S)
          if '!important' in code:
              raise SystemExit('Actual !important declaration found in availability CSS')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Version assets
        run: npm run assets:version
      - name: Check
        run: npm run check
      - name: Install Edge
        run: npx playwright install --with-deps msedge
      - name: Affected admin tests
        run: npx playwright test tests/admin-availability-selected-days-mobile.spec.js tests/admin-availability-mobile.spec.js tests/admin-shared-components.spec.js tests/admin-v2-regressions.spec.js
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix selected day mobile layout"
          git push origin HEAD:CHATGPT_TEST
