name: One-time promote TEST to luminails.hu without retest

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-promote-no-tests.yml

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  promote:
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout live repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: live
          fetch-depth: 0

      - name: Checkout approved TEST commit
        uses: actions/checkout@v4
        with:
          repository: enneno/enneno.github.io
          ref: a56f3e15c1d1ce088b2eca40035933a293944497
          path: tested
          persist-credentials: false

      - name: Validate source and live domain
        shell: bash
        run: |
          test ! -e tested/CNAME
          grep -qx 'luminails.hu' live/CNAME

      - name: Prepare and commit live release
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='CNAME' \
            --exclude='node_modules/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            tested/ live/
          git -C live rm .github/workflows/one-time-promote-no-tests.yml
          git -C live config user.name "github-actions[bot]"
          git -C live config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C live add -A
          git -C live commit -m "release: promote TEST a56f3e15c1d without retest"
          git -C live push origin HEAD:main

      - name: Prepare Pages artifact
        shell: bash
        run: |
          artifact_dir="${RUNNER_TEMP}/live-site"
          mkdir -p "$artifact_dir"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='playwright-report/' \
            --exclude='test-results/' \
            live/ "$artifact_dir/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/live-site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
