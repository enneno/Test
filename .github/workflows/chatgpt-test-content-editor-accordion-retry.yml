name: Fix content editor regression test runner

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - '.github/workflows/chatgpt-test-content-editor-accordion-retry.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Fix Playwright import and retrigger verification
        shell: bash
        run: |
          sed -i "s/require('@playwright\/test')/require('playwright\/test')/" .github/workflows/chatgpt-test-content-editor-accordion.yml
          rm -f .github/workflows/chatgpt-test-content-editor-accordion-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix content editor regression runner'
          git push origin HEAD:CHATGPT_TEST
