name: Finalize 21st-style PWA toolbar dock

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - '.github/workflows/chatgpt-test-21st-toolbar-dock-v2.yml'

permissions:
  contents: write

jobs:
  finalize-toolbar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply toolbar replacement
        run: python3 scripts/chatgpt-toolbar-dock-patch.py

      - name: Verify toolbar source
        run: |
          grep -q "pwa-admin-toolbar-dock" pwa-admin-shell.js
          grep -q "data-admin-v2-nav=\"attekintes\"" pwa-admin-shell.js
          grep -q "grid-template-columns: repeat(6, 44px);" src/admin-styles/95-pwa.css
          grep -q "toHaveCount(6)" tests/pwa.spec.js
          grep -q "pwa-admin-toolbar-button" tests/admin-production-redesign.spec.js
          ! grep -q "\.pwa-admin-tabbar" src/admin-styles/95-pwa.css

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Update asset versions
        run: npm run assets:version

      - name: Run source and CSS checks
        run: npm run check

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Test admin regressions
        run: npm run test:admin

      - name: Test standalone PWA toolbar
        run: npx playwright test tests/pwa.spec.js

      - name: Remove temporary helpers and commit result
        run: |
          rm -f .github/workflows/chatgpt-test-21st-toolbar-dock.yml
          rm -f .github/workflows/chatgpt-test-21st-toolbar-dock-v2.yml
          rm -f scripts/chatgpt-toolbar-dock-patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'Replace PWA tabbar with 21st-style toolbar dock'
          git push origin HEAD:CHATGPT_TEST
