name: Shared CMS image workspace

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - '.github/workflows/chatgpt-test-cms-image-workspace.yml'

permissions:
  contents: write

jobs:
  cms-image-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply canonical CMS image layout
        run: python3 scripts/chatgpt-cms-image-workspace.py

      - name: Verify shared image ownership
        run: |
          grep -q 'grid-template-areas:' src/admin-styles/40-content-editor.css
          grep -q 'cms-image-lightbox' src/admin-styles/40-content-editor.css
          grep -q 'grid-template-areas: "preview controls"' src/admin-styles/45-gallery-editor.css
          grep -q 'display: grid;' src/admin-styles/45-gallery-editor.css
          grep -q 'cms-image-preview-interactive' src/admin/46-cms-image-workspace.js
          grep -q 'CMS image uploads share compact side-by-side controls and a lightbox' tests/admin-production-redesign.spec.js

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Update asset versions
        run: npm run assets:version

      - name: Run source and CSS checks
        run: npm run check

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Test admin regressions
        run: npm run test:admin

      - name: Test PWA shell
        run: npx playwright test tests/pwa.spec.js

      - name: Remove temporary helper and workflow, then commit
        run: |
          rm -f scripts/chatgpt-cms-image-workspace.py
          rm -f .github/workflows/chatgpt-test-cms-image-workspace.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'Unify CMS image upload layout and preview'
          git push origin HEAD:CHATGPT_TEST
