name: Optically align CHATGPT_TEST picker icon
on:
  push:
    branches: [CHATGPT_TEST]
    paths: ['.github/workflows/chatgpt-test-picker-optical-icon.yml']
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - name: Patch only visible picker icon position
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/admin-styles/10-components.css')
          s = p.read_text()
          old = '  background-position: right 5px center;'
          new = '  background-position: right 2px center;'
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify targeted result
        run: |
          grep -F 'background-position: right 2px center;' src/admin-styles/10-components.css
          grep -F 'grid-template-columns: minmax(0, 1.7fr) minmax(0, .65fr) minmax(0, .65fr);' src/admin-styles/30-bookings.css
      - name: Commit result and remove temporary workflow
        run: |
          rm .github/workflows/chatgpt-test-picker-optical-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin-styles/10-components.css admin-v2.css admin/index.html .github/workflows/chatgpt-test-picker-optical-icon.yml
          git commit -m 'Optically align shared picker icon'
          git push origin HEAD:CHATGPT_TEST
