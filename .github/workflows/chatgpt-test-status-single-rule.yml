name: Consolidate CHATGPT_TEST status font rule

on:
  push:
    branches:
      - CHATGPT_TEST

permissions:
  contents: write

jobs:
  tune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Consolidate status font rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/admin-styles/30-bookings.css')
          s = p.read_text()
          old = '''  .admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya:not(.szerkeszt) .admin-db-statusz:disabled { font-size: 11px; font-size-adjust: none; }\n  .admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya.szerkeszt .admin-db-statusz { font-size: 11px; font-size-adjust: none; }'''
          new = '''  .admin-body.admin-v2 #admin-panel-foglalasok .admin-db-statusz { font-size: 11px; font-size-adjust: none; }'''
          if old not in s:
              raise SystemExit('Expected two status font rules not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check

      - name: Commit canonical change and remove workflow
        shell: bash
        run: |
          rm .github/workflows/chatgpt-test-status-single-rule.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin-styles/30-bookings.css admin-v2.css admin/index.html .github/workflows/chatgpt-test-status-single-rule.yml
          git commit -m 'Use one booking status font rule' || exit 0
          git push origin HEAD:CHATGPT_TEST
