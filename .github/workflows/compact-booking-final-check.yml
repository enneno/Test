name: Compact booking final check

on:
  push:
    branches:
      - compact-booking-card-fix

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Refresh asset versions
        run: npm run assets:version

      - name: Verify site and admin CSS
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify booking card at 390px
        shell: bash
        run: |
          timeout 30s node - <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            let browser;
            try {
              const css = fs.readFileSync('admin-v2.css', 'utf8');
              const enhancer = fs.readFileSync('src/admin/47-booking-card-click.js', 'utf8');
              browser = await chromium.launch({ headless: true });
              const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
              page.setDefaultTimeout(5000);
              await page.setContent(`<!doctype html><html><head><style>${css}</style></head>
                <body class="admin-body admin-v2"><div id="admin-tartalom">
                  <div id="admin-panel-foglalasok" class="admin-db-panel aktiv">
                    <div id="admin-foglalas-lista" class="admin-db-lista">
                      <article class="admin-db-kartya admin-foglalas-kartya admin-foglalas-statusz-cancelled_by_customer" data-id="test-booking" data-tipus="booking">
                        <div class="admin-db-kartya-fej">
                          <div class="admin-foglalas-fosor">
                            <div class="admin-foglalas-nev-blokk">
                              <p class="admin-kartya-tipus admin-foglalas-azonosito"><code>LUMI-TEST</code></p>
                              <h3>Teszt Vendég</h3>
                              <p class="admin-foglalas-rovid-szolgaltatas">Építés - M méret</p>
                            </div>
                            <p class="admin-foglalas-idopont"><span class="admin-foglalas-datum">16/08/26</span><span class="admin-foglalas-ido">10:00 – 13:00</span></p>
                          </div>
                          <div class="admin-foglalas-vezerlok">
                            <select class="admin-db-statusz" data-foglalas-statusz disabled><option selected>Vendég mondta le</option></select>
                            <button type="button" class="admin-kis-gomb" data-foglalas-reszletek aria-expanded="false">Részletek</button>
                            <button type="button" class="admin-kis-gomb" data-foglalas-szerkesztes>Szerkesztés</button>
                          </div>
                        </div>
                        <div class="admin-foglalas-reszletek admin-foglalas-reszletek-kompakt"><p>Teszt részlet</p></div>
                      </article>
                    </div>
                  </div>
                </div>
                <script>
                  document.addEventListener('DOMContentLoaded', () => {
                    document.getElementById('admin-foglalas-lista').addEventListener('click', event => {
                      const button = event.target.closest('[data-foglalas-reszletek]');
                      if (!button) return;
                      const card = button.closest('.admin-foglalas-kartya');
                      const open = !card.classList.contains('admin-foglalas-kartya-nyitott');
                      card.classList.toggle('admin-foglalas-kartya-nyitott', open);
                      button.setAttribute('aria-expanded', String(open));
                    });
                  });
                <\/script>
                <script>${enhancer}<\/script></body></html>`, { waitUntil: 'domcontentloaded', timeout: 5000 });
              await page.waitForTimeout(50);

              const card = page.locator('.admin-foglalas-kartya');
              if (!(await card.evaluate(el => el.classList.contains('admin-foglalas-kartya-kattinthato')))) throw new Error('Whole-card details interaction missing.');
              if (await card.locator('[data-foglalas-reszletek]').evaluate(el => getComputedStyle(el).display) !== 'none') throw new Error('Details button is visible.');
              if (await card.locator('[data-foglalas-szerkesztes]').evaluate(el => getComputedStyle(el).fontSize) !== '0px') throw new Error('Edit label is visible.');

              const boxes = await card.evaluate(el => {
                const b = selector => el.querySelector(selector).getBoundingClientRect();
                return { date: b('.admin-foglalas-datum'), time: b('.admin-foglalas-ido'), marker: b('.admin-foglalas-azonosito'), name: b('h3'), status: b('.admin-db-statusz'), edit: b('[data-foglalas-szerkesztes]') };
              });
              if (Math.abs(boxes.date.top - boxes.time.top) > 3) throw new Error('Date and time are not one row.');
              if (!(boxes.date.bottom <= boxes.marker.top + 3)) throw new Error('Date row is not on top.');
              if (!(boxes.marker.top < boxes.name.top)) throw new Error('Marker must be above the customer name.');
              if (boxes.status.right > boxes.edit.left + 1) throw new Error('Status overlaps edit icon.');
              if (boxes.status.width < 115) throw new Error('Status is too narrow.');

              await card.locator('h3').evaluate(el => el.click());
              await page.waitForTimeout(10);
              if (!(await card.evaluate(el => el.classList.contains('admin-foglalas-kartya-nyitott')))) throw new Error('Card did not open details.');
              await card.locator('h3').evaluate(el => el.click());
              await page.waitForTimeout(10);
              if (await card.evaluate(el => el.classList.contains('admin-foglalas-kartya-nyitott'))) throw new Error('Card did not close details.');
            } finally {
              if (browser) await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v2.css admin-supabase.js admin/index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Build refined compact booking cards"
          git push origin HEAD:compact-booking-card-fix
