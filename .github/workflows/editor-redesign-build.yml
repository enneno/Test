name: Editor redesign build

on:
  push:
    branches:
      - simplify-content-price-editors

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Refresh asset versions
        run: npm run assets:version

      - name: Verify site and admin CSS
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused editor smoke test
        shell: bash
        run: |
          npm run serve > /tmp/luminails-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8101/admin/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await page.goto('http://127.0.0.1:8101/admin/');
            const css = await page.request.get('http://127.0.0.1:8101/admin-v2.css');
            if (!css.ok()) throw new Error('admin-v2.css not served');
            const source = await css.text();
            for (const token of ['cms-section-picker', 'admin-szolgaltatas-kartya.szerkeszt', '86dvh']) {
              if (!source.includes(token)) throw new Error('Missing editor CSS token: ' + token);
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit generated admin assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v2.css admin/index.html
          if git diff --cached --quiet; then
            echo "No generated admin changes to commit."
            exit 0
          fi
          git commit -m "Build simplified editor workflows"
          git push origin HEAD:simplify-content-price-editors
