name: Fix CHATGPT_TEST browser control parity

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - '.github/workflows/chatgpt-test-browser-control-parity.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch canonical CSS
        run: |
          python - <<'PY'
          from pathlib import Path

          components = Path('src/admin-styles/10-components.css')
          s = components.read_text()

          old = '''  --admin-ui-placeholder-font-size: 11px;\n  --admin-ui-ios-field-optical-ratio: 0.32;'''
          new = '''  --admin-ui-placeholder-font-size: 11px;\n  --admin-ui-select-font-size: 11px;\n  --admin-ui-page-size-font-size: 11px;\n  --admin-ui-picker-font-size: 20px;\n  --admin-ui-ios-field-optical-ratio: 0.32;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  font-size: 11px;\n  font-size-adjust: none;\n  padding-right: 34px;'''
          new = '''  font-size: var(--admin-ui-select-font-size);\n  font-size-adjust: none;\n  padding-right: 34px;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  font-size: var(--lumi-font-control);\n  font-weight: 850;'''
          new = '''  font-size: var(--admin-ui-page-size-font-size);\n  font-weight: 850;'''
          assert old in s
          s = s.replace(old, new, 1)

          # Make the picker typography use one variable everywhere.
          s = s.replace('font-size: 20px;', 'font-size: var(--admin-ui-picker-font-size);')

          old = '''  font-family: inherit;\n  font-size: var(--admin-ui-picker-font-size);\n  font-weight: 720;'''
          new = '''  font-family: inherit;\n  font-size: var(--admin-ui-picker-font-size);\n  font-size-adjust: none;\n  font-weight: 720;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  overflow: hidden;\n  font-size: var(--admin-ui-picker-font-size);\n  line-height: 1.1;'''
          new = '''  overflow: hidden;\n  font-family: inherit;\n  font-size: var(--admin-ui-picker-font-size);\n  font-size-adjust: none;\n  font-weight: 720;\n  line-height: 1.1;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  padding: 0;\n  font-size: var(--admin-ui-picker-font-size);\n  line-height: 1.1;'''
          new = '''  padding: 0;\n  font-family: inherit;\n  font-size: var(--admin-ui-picker-font-size);\n  font-size-adjust: none;\n  font-weight: 720;\n  line-height: 1.1;'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  font-size: var(--admin-ui-picker-font-size);\n  line-height: 1.1;\n}\n\n.admin-body.admin-v2 :is(#admin-tartalom, #admin-bejelentkezes-panel) :is(input[type="date"], input[type="time"], input[type="month"]):focus'''
          new = '''  font-family: inherit;\n  font-size: var(--admin-ui-picker-font-size);\n  font-size-adjust: none;\n  font-weight: 720;\n  line-height: 1.1;\n}\n\n.admin-body.admin-v2 :is(#admin-tartalom, #admin-bejelentkezes-panel) :is(input[type="date"], input[type="time"], input[type="month"]):focus'''
          assert old in s
          s = s.replace(old, new, 1)

          # Safari browser and standalone Web App render native control text differently.
          # Keep one component rule; only the shared variables differ by display mode.
          marker = '/* Shared native date/time/month controls: one visual owner for the entire admin. */'
          browser_vars = '''@media (display-mode: browser) and (max-width: 768px) {\n  .admin-body.admin-v2 {\n    --admin-ui-page-size-font-size: 14px;\n    --admin-ui-picker-font-size: 22px;\n  }\n}\n\n'''
          assert marker in s
          s = s.replace(marker, browser_vars + marker, 1)
          components.write_text(s)

          bookings = Path('src/admin-styles/30-bookings.css')
          b = bookings.read_text()

          old = '''  background-color: var(--admin-v2-surface);\n  font-size: 11px;\n  font-weight: 780;'''
          new = '''  background-color: var(--admin-v2-surface);\n  font-weight: 780;'''
          assert old in b
          b = b.replace(old, new, 1)

          old = '''  height: 34px;\n  min-height: 34px;\n  padding: 0 10px;'''
          new = '''  height: 34px;\n  min-height: 34px;\n  padding: 0 28px;'''
          assert old in b
          b = b.replace(old, new, 1)

          old = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya:not(.szerkeszt) .admin-db-statusz:disabled {\n  padding-inline: 10px;\n  background-image: none;'''
          new = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya:not(.szerkeszt) .admin-db-statusz:disabled {\n  background-image: none;'''
          assert old in b
          b = b.replace(old, new, 1)

          old = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya.szerkeszt .admin-db-statusz {\n  padding: 0 28px 0 10px;\n  background-image:'''
          new = '''.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya.szerkeszt .admin-db-statusz {\n  background-image:'''
          assert old in b
          b = b.replace(old, new, 1)
          bookings.write_text(b)
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify control ownership
        run: |
          python - <<'PY'
          from pathlib import Path
          c = Path('src/admin-styles/10-components.css').read_text()
          b = Path('src/admin-styles/30-bookings.css').read_text()
          assert '--admin-ui-page-size-font-size: 11px' in c
          assert '--admin-ui-picker-font-size: 20px' in c
          assert '--admin-ui-page-size-font-size: 14px' in c
          assert '--admin-ui-picker-font-size: 22px' in c
          assert 'font-size: var(--admin-ui-page-size-font-size)' in c
          assert 'font-size: var(--admin-ui-picker-font-size)' in c
          assert 'padding: 0 28px;' in b
          assert 'padding: 0 28px 0 10px' not in b
          assert 'padding-inline: 10px' not in b
          block = b[b.index('.admin-pagination-size .admin-oldalmeret-select'):]
          block = block[:block.index('}')]
          assert 'font-size:' not in block
          print('browser/app control ownership verified')
          PY
      - name: Commit verified result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-test-browser-control-parity.yml
          git add src/admin-styles/10-components.css src/admin-styles/30-bookings.css admin-v2.css admin/index.html
          git add -u
          git commit -m "Align browser admin controls with app"
          git push origin HEAD:CHATGPT_TEST
