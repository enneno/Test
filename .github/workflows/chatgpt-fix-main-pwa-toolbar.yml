name: Fix production PWA toolbar

on:
  push:
    branches:
      - CHATGPT_TEST
    paths:
      - .github/workflows/chatgpt-fix-main-pwa-toolbar.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.event.head_commit.message == 'Add production PWA toolbar verification'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Wire PWA runtime into public and admin pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def insert_before_body(path, snippets):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              missing = [s for needle, s in snippets if needle not in text]
              if not missing:
                  return
              marker = '</body>'
              if marker not in text:
                  raise SystemExit(f'{path}: missing </body>')
              block = '\n' + '\n'.join('    ' + s for s in missing) + '\n'
              text = text.replace(marker, block + marker, 1)
              p.write_text(text, encoding='utf-8')

          insert_before_body('index.html', [
              ('/pwa.js', '<script src="/pwa.js"></script>'),
          ])
          insert_before_body('admin/index.html', [
              ('/pwa.js', '<script src="/pwa.js"></script>'),
              ('/pwa-admin-shell.js', '<script src="/pwa-admin-shell.js"></script>'),
          ])

          updater = Path('scripts/update-asset-versions.js')
          text = updater.read_text(encoding='utf-8')
          if "    'pwa.js'," not in text:
              text = text.replace("    'admin-content.js'\n", "    'admin-content.js',\n    'pwa.js',\n    'pwa-admin-shell.js'\n", 1)
          elif "    'pwa-admin-shell.js'" not in text:
              text = text.replace("    'pwa.js',\n", "    'pwa.js',\n    'pwa-admin-shell.js',\n", 1)
          updater.write_text(text, encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          admin_test = package['scripts']['test:admin']
          if 'tests/pwa.spec.js' not in admin_test:
              package['scripts']['test:admin'] = admin_test + ' tests/pwa.spec.js'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Verify admin release including PWA toolbar
        run: npm run verify:admin

      - name: Verify versioned PWA scripts are present
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('index.html').read_text(encoding='utf-8')
          admin = Path('admin/index.html').read_text(encoding='utf-8')
          checks = [
              (root, r'/pwa\.js\?v=[0-9a-f]{12}', 'root pwa.js'),
              (admin, r'/pwa\.js\?v=[0-9a-f]{12}', 'admin pwa.js'),
              (admin, r'/pwa-admin-shell\.js\?v=[0-9a-f]{12}', 'admin pwa-admin-shell.js'),
          ]
          for text, pattern, label in checks:
              if not re.search(pattern, text):
                  raise SystemExit(f'Missing versioned {label}')
          PY

      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-fix-main-pwa-toolbar.yml
          git add index.html admin/index.html scripts/update-asset-versions.js package.json
          git commit -m "Wire PWA admin toolbar into production"
          git push origin CHATGPT_TEST
