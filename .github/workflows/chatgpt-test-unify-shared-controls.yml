name: Unify shared admin controls

on:
  push:
    branches:
      - CHATGPT_TEST
    paths:
      - .github/workflows/chatgpt-test-unify-shared-controls.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply canonical refactor
        run: python3 scripts/chatgpt-unify-shared-controls.py

      - name: Reject override hacks
        run: |
          if grep -n "!important" src/admin-styles/10-components.css src/admin-styles/30-bookings.css src/admin-styles/40-content-editor.css src/admin-styles/42-cms-image-controls.css src/admin-styles/45-gallery-editor.css; then
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Version assets
        run: npm run assets:version

      - name: Check
        run: npm run check

      - name: Install Edge
        run: npx playwright install --with-deps msedge

      - name: Affected admin tests
        run: npx playwright test tests/admin-production-redesign.spec.js tests/admin-booking-css-architecture.spec.js tests/admin-v2-regressions.spec.js tests/admin-cms-image-workspace.spec.js tests/admin-gallery-workspace-pagination.spec.js tests/admin-content-editor-accordion.spec.js tests/admin-shared-components.spec.js

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify shared admin controls"
          git push origin HEAD:CHATGPT_TEST
