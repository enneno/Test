name: Unify shared admin controls

on:
  push:
    branches:
      - CHATGPT_TEST
    paths:
      - .github/workflows/chatgpt-test-unify-shared-controls.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fix temporary refactor runner
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('scripts/chatgpt-unify-shared-controls.py')
          s = p.read_text(encoding='utf-8')
          start = "for pattern, label in [\n    (r'\\.admin-body\\.admin-v2 #admin-panel-szovegek \\.cms-icon-button:hover"
          end = "write(image_controls_path, image_controls)"
          a = s.index(start)
          b = s.index(end, a)
          replacement = """image_controls, count = re.subn(r'\\.admin-body\\.admin-v2 #admin-panel-szovegek \\.cms-icon-button svg \\{.*?\\n\\}\\n\\n', '', image_controls, count=1, flags=re.S)\nif count != 1:\n    raise SystemExit(f'cms icon svg: expected 1 replacement, got {count}')\n"""
          p.write_text(s[:a] + replacement + s[b:], encoding='utf-8')
          PY

      - name: Apply canonical refactor
        run: python3 scripts/chatgpt-unify-shared-controls.py

      - name: Reject override hacks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              'src/admin-styles/10-components.css',
              'src/admin-styles/30-bookings.css',
              'src/admin-styles/40-content-editor.css',
              'src/admin-styles/42-cms-image-controls.css',
              'src/admin-styles/45-gallery-editor.css',
          ]
          offenders = []
          for filename in files:
              text = Path(filename).read_text(encoding='utf-8')
              # Strip CSS comments so the architectural comment "no !important" is not a false positive.
              import re
              code = re.sub(r'/\*.*?\*/', '', text, flags=re.S)
              if '!important' in code:
                  offenders.append(filename)
          if offenders:
              raise SystemExit('Actual !important declaration found in: ' + ', '.join(offenders))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Version assets
        run: npm run assets:version

      - name: Check
        run: npm run check

      - name: Install Edge
        run: npx playwright install --with-deps msedge

      - name: Affected admin tests
        run: npx playwright test tests/admin-production-redesign.spec.js tests/admin-booking-css-architecture.spec.js tests/admin-v2-regressions.spec.js tests/admin-cms-image-workspace.spec.js tests/admin-gallery-workspace-pagination.spec.js tests/admin-content-editor-accordion.spec.js tests/admin-shared-components.spec.js

      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify shared admin controls"
          git push origin HEAD:CHATGPT_TEST
