name: Match CHATGPT_TEST status text to edit state

on:
  push:
    branches:
      - CHATGPT_TEST

permissions:
  contents: write

jobs:
  tune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Patch only collapsed status font size
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/admin-styles/30-bookings.css')
          s = p.read_text()
          old = '.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya:not(.szerkeszt) .admin-db-statusz:disabled { font-size: 14px; font-size-adjust: none; }'
          new = '.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya:not(.szerkeszt) .admin-db-statusz:disabled { font-size: 11px; font-size-adjust: none; }'
          if old not in s:
              raise SystemExit('Target collapsed status rule not found exactly')
          p.write_text(s.replace(old, new, 1))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check

      - name: Commit targeted change and remove workflow
        shell: bash
        run: |
          rm .github/workflows/chatgpt-test-status-match-edit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/admin-styles/30-bookings.css admin-v2.css admin/index.html .github/workflows/chatgpt-test-status-match-edit.yml
          git commit -m 'Match collapsed booking status text to edit state' || exit 0
          git push origin HEAD:CHATGPT_TEST
