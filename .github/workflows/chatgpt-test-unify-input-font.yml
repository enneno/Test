name: Unify CHATGPT_TEST input font
on:
  push:
    branches: [CHATGPT_TEST]
    paths: ['.github/workflows/chatgpt-test-unify-input-font.yml']
permissions:
  contents: write
jobs:
  unify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit and patch canonical input ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          components = Path('src/admin-styles/10-components.css')
          s = components.read_text()

          # Add one shared normal-input font owner immediately after the generic input geometry rule.
          anchor = '''.admin-body.admin-v2 :is(#admin-tartalom, #admin-bejelentkezes-panel) input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="reset"]) {\n  width: 100%;\n  min-width: 0;\n  height: var(--admin-ui-field-height);\n  min-height: var(--admin-ui-field-height);\n  padding: 0 var(--admin-ui-field-padding-x);\n  border-radius: var(--admin-ui-control-radius);\n  line-height: var(--admin-ui-control-line-height);\n}\n'''
          if anchor not in s:
              raise SystemExit('generic input geometry anchor not found')

          shared = '''\n/* Normal text-like inputs: one font-size owner for the entire admin.\n   Native date/time/month controls keep their dedicated picker rule below. */\n.admin-body.admin-v2 :is(#admin-tartalom, #admin-bejelentkezes-panel) input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="date"]):not([type="time"]):not([type="month"]) {\n  font-size: 12px;\n}\n'''
          if 'Normal text-like inputs: one font-size owner' not in s:
              s = s.replace(anchor, anchor + shared, 1)
          components.write_text(s)

          # Remove feature-level font-size declarations from rules whose selectors explicitly target input.
          files = sorted(Path('src/admin-styles').glob('*.css'))
          removed = []
          for path in files:
              if path.name == '10-components.css':
                  continue
              text = path.read_text()
              out = []
              pos = 0
              pattern = re.compile(r'([^{}]+)\{([^{}]*)\}', re.S)
              changed = False
              for m in pattern.finditer(text):
                  out.append(text[pos:m.start()])
                  selector, body = m.group(1), m.group(2)
                  new_body = body
                  if re.search(r'\binput\b|input\[', selector):
                      new_body, n = re.subn(r'(?m)^([ \t]*)font-size\s*:\s*[^;]+;\s*\n?', '', new_body)
                      if n:
                          removed.append((path.name, ' '.join(selector.split())[:180], n))
                          changed = True
                  out.append(selector + '{' + new_body + '}')
                  pos = m.end()
              out.append(text[pos:])
              if changed:
                  path.write_text(''.join(out))

          # Keep the dedicated picker font-size declarations in components.css, but no other input font owners there.
          print('Removed feature input font-size declarations:')
          for item in removed:
              print(item)
          PY

          # Prevent iOS form-focus auto zoom for intentionally 12px admin text inputs.
          python - <<'PY'
          from pathlib import Path
          p = Path('admin/index.html')
          s = p.read_text()
          old = '<meta name="viewport" content="width=device-width, initial-scale=1.0">'
          new = '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">'
          if old not in s and new not in s:
              raise SystemExit('viewport meta not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c = Path('src/admin-styles/10-components.css').read_text()
          assert 'font-size: 12px;' in c
          assert ':not([type="date"]):not([type="time"]):not([type="month"])' in c
          assert '--admin-ui-picker-icon-size: 13px;' in c
          assert 'font-size: 20px;' in c
          html = Path('admin/index.html').read_text()
          assert 'maximum-scale=1.0' in html

          offenders = []
          for path in sorted(Path('src/admin-styles').glob('*.css')):
              if path.name == '10-components.css':
                  continue
              text = path.read_text()
              for m in re.finditer(r'([^{}]+)\{([^{}]*)\}', text, re.S):
                  sel, body = m.group(1), m.group(2)
                  if (re.search(r'\binput\b|input\[', sel) and re.search(r'font-size\s*:', body)):
                      offenders.append((path.name, ' '.join(sel.split())))
          if offenders:
              raise SystemExit('feature input font-size owners remain: ' + repr(offenders))
          print('Verified: one normal-input font owner; picker remains dedicated.')
          PY
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/chatgpt-test-unify-input-font.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unify admin input font sizing"
          git push origin CHATGPT_TEST
