name: Fix CMS icon controls

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - .github/workflows/chatgpt-test-fix-cms-icons.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Fix gallery icon ownership and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('src/admin/46-cms-image-workspace.js')
          js = js_path.read_text(encoding='utf-8')
          old = """        button.innerHTML = ICONS[icon];\n        button.classList.add('cms-icon-button', 'admin-control-icon-button');\n        button.classList.toggle('cms-icon-button-danger', danger);\n"""
          new = """        button.innerHTML = ICONS[icon];\n        if (button.matches('[data-cms-gallery-add], [data-cms-gallery-move]')) {\n            button.classList.remove('admin-hozzaadas', 'admin-kis-gomb', 'admin-veszely-gomb');\n        }\n        button.classList.add('cms-icon-button', 'admin-control-icon-button');\n        button.classList.toggle('cms-icon-button-danger', danger);\n"""
          if js.count(old) != 1:
              raise SystemExit(f'Button iconification marker count: {js.count(old)}')
          js_path.write_text(js.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/admin-cms-image-workspace.spec.js')
          test = test_path.read_text(encoding='utf-8')

          add_marker = """    await expect(page.locator('[data-cms-gallery-add]')).toHaveAttribute('aria-label', 'Új galériakép');\n    await expect(page.locator('[data-cms-gallery-add] svg')).toHaveCount(1);\n    expect(await page.locator('[data-cms-gallery-add]').innerText()).toBe('');\n"""
          add_extra = add_marker + """    await expect(page.locator('[data-cms-gallery-add]')).not.toHaveClass(/admin-hozzaadas|admin-kis-gomb/);\n"""
          if add_marker not in test:
              raise SystemExit('Gallery add assertion marker not found')
          test = test.replace(add_marker, add_extra, 1)

          move_marker = """    await expect(galleryControls.locator('[data-cms-gallery-move=\"up\"]')).toBeDisabled();\n    await expect(galleryControls.locator('[data-cms-gallery-move=\"down\"]')).toBeEnabled();\n"""
          move_extra = move_marker + """    await expect(galleryControls.locator('[data-cms-gallery-move=\"up\"]')).not.toHaveClass(/admin-kis-gomb|admin-hozzaadas/);\n    await expect(galleryControls.locator('[data-cms-gallery-move=\"down\"]')).not.toHaveClass(/admin-kis-gomb|admin-hozzaadas/);\n\n    const iconMetrics = await page.evaluate(() => {\n        const measure = selector => {\n            const button = document.querySelector(selector);\n            const svg = button?.querySelector('svg');\n            const buttonStyle = button ? getComputedStyle(button) : null;\n            const svgRect = svg?.getBoundingClientRect();\n            return {\n                svgWidth: svgRect?.width || 0,\n                svgHeight: svgRect?.height || 0,\n                paddingLeft: buttonStyle?.paddingLeft || '',\n                paddingRight: buttonStyle?.paddingRight || ''\n            };\n        };\n        return {\n            add: measure('[data-cms-gallery-add]'),\n            up: measure('[data-test-gallery-image] [data-cms-gallery-move=\"up\"]'),\n            down: measure('[data-test-gallery-image] [data-cms-gallery-move=\"down\"]')\n        };\n    });\n    for (const metric of Object.values(iconMetrics)) {\n        expect(metric.svgWidth).toBeGreaterThanOrEqual(15);\n        expect(metric.svgHeight).toBeGreaterThanOrEqual(15);\n        expect(metric.paddingLeft).toBe('0px');\n        expect(metric.paddingRight).toBe('0px');\n    }\n"""
          if move_marker not in test:
              raise SystemExit('Gallery move assertion marker not found')
          test = test.replace(move_marker, move_extra, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Version assets
        run: npm run assets:version

      - name: Check
        run: npm run check

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Run affected admin tests
        run: npx playwright test tests/admin-cms-image-workspace.spec.js tests/admin-shared-components.spec.js tests/admin-content-editor-accordion.spec.js tests/admin-production-redesign.spec.js

      - name: Commit verified icon fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-test-fix-cms-icons.yml
          git add src/admin/46-cms-image-workspace.js tests/admin-cms-image-workspace.spec.js admin-v2.css admin/index.html
          git commit -m "Fix CMS gallery icon controls"
          git push origin CHATGPT_TEST
