name: Fix CMS icon controls

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - .github/workflows/chatgpt-test-fix-cms-icons.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Keep shared icon SVGs from shrinking
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/admin-styles/10-components.css')
          css = css_path.read_text(encoding='utf-8')
          old = '''.admin-body.admin-v2 .admin-control-icon-button svg {
  width: 16px;
  height: 16px;
  fill: none;
'''
          new = '''.admin-body.admin-v2 .admin-control-icon-button svg {
  width: 16px;
  height: 16px;
  flex: 0 0 16px;
  fill: none;
'''
          if css.count(old) != 1:
              raise SystemExit(f'Shared icon SVG marker count: {css.count(old)}')
          css_path.write_text(css.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/admin-cms-image-workspace.spec.js')
          test = test_path.read_text(encoding='utf-8')
          marker = '''    await expect(galleryControls.locator('[data-cms-gallery-move="up"]')).toBeDisabled();
    await expect(galleryControls.locator('[data-cms-gallery-move="down"]')).toBeEnabled();
'''
          addition = marker + '''
    const galleryIconMetrics = await page.evaluate(() => {
        const size = selector => {
            const svg = document.querySelector(selector)?.querySelector('svg');
            const rect = svg?.getBoundingClientRect();
            return { width: rect?.width || 0, height: rect?.height || 0 };
        };
        return {
            add: size('[data-cms-gallery-add]'),
            up: size('[data-test-gallery-image] [data-cms-gallery-move="up"]'),
            down: size('[data-test-gallery-image] [data-cms-gallery-move="down"]')
        };
    });
    for (const metric of Object.values(galleryIconMetrics)) {
        expect(metric.width).toBeGreaterThanOrEqual(15);
        expect(metric.height).toBeGreaterThanOrEqual(15);
    }
'''
          if marker not in test:
              raise SystemExit('Gallery move assertion marker not found')
          test_path.write_text(test.replace(marker, addition, 1), encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Version assets
        run: npm run assets:version

      - name: Check
        run: npm run check

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Run affected admin tests
        run: npx playwright test tests/admin-cms-image-workspace.spec.js tests/admin-shared-components.spec.js tests/admin-content-editor-accordion.spec.js tests/admin-production-redesign.spec.js

      - name: Commit verified icon fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/chatgpt-test-fix-cms-icons.yml
          git add src/admin-styles/10-components.css tests/admin-cms-image-workspace.spec.js admin-v2.css admin/index.html
          git commit -m "Fix CMS gallery icon rendering"
          git push origin CHATGPT_TEST
