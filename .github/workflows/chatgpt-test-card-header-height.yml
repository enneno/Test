name: Unify booking card header height

on:
  push:
    branches: [CHATGPT_TEST]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Unify booking card header geometry
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src/admin-styles/30-bookings.css';
          let css = fs.readFileSync(path, 'utf8');

          const baseOld = `.admin-body.admin-v2 #admin-panel-foglalasok .admin-db-kartya-fej {\n  position: relative;\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  grid-template-areas: \"identity controls\";\n  align-items: end;\n  min-height: 78px;\n  gap: 0 12px;\n  padding: 6px 0;\n}\n.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-kartya:not(.admin-foglalas-kartya-nyitott):not(.szerkeszt) .admin-db-kartya-fej {\n  height: 78px;\n  min-height: 78px;\n}`;
          const baseNew = `.admin-body.admin-v2 #admin-panel-foglalasok .admin-db-kartya-fej {\n  position: relative;\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  grid-template-areas: \"identity controls\";\n  align-items: end;\n  height: 78px;\n  min-height: 78px;\n  gap: 0 12px;\n  padding: 6px 0;\n}`;
          if (!css.includes(baseOld)) throw new Error('Expected booking card header block not found');
          css = css.replace(baseOld, baseNew);

          const mobileOld = `.admin-body.admin-v2 #admin-panel-foglalasok .admin-db-kartya-fej { min-height: 96px; gap: 4px 10px; padding: 8px 0; }`;
          const mobileNew = `.admin-body.admin-v2 #admin-panel-foglalasok .admin-db-kartya-fej { height: 78px; min-height: 78px; gap: 4px 10px; padding: 8px 0; }`;
          if (!css.includes(mobileOld)) throw new Error('Expected mobile booking card header block not found');
          css = css.replace(mobileOld, mobileNew);

          fs.writeFileSync(path, css);
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify shared header height
        shell: bash
        run: |
          grep -q 'height: 78px;' src/admin-styles/30-bookings.css
          ! grep -q 'min-height: 96px' src/admin-styles/30-bookings.css
          ! grep -q 'admin-foglalas-kartya:not(.admin-foglalas-kartya-nyitott):not(.szerkeszt) .admin-db-kartya-fej' src/admin-styles/30-bookings.css
      - name: Commit verified result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-test-card-header-height.yml
          git add -A
          git commit -m "Unify booking card header height"
          git push origin CHATGPT_TEST
