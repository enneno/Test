name: Sync generated assets on review branch

on:
  push:
    branches:
      - chatgpt-local-review
    paths:
      - 'src/**'

permissions:
  contents: write

concurrency:
  group: sync-generated-review
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-local-review

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Verify and rebuild
        run: npm run verify

      - name: Commit generated assets
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- style.css admin-v2.css script.js booking.js admin-supabase.js index.html admin/index.html arlista/index.html galeria/index.html foglalas/index.html adatkezeles/index.html
          git commit -m "Rebuild generated assets after review refactor"
          git push origin HEAD:chatgpt-local-review
