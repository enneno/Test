name: Tune booking details spacing

on:
  push:
    branches: [CHATGPT_TEST]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch canonical booking CSS
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'src/admin-styles/30-bookings.css';
          let css = fs.readFileSync(path, 'utf8');

          const detailOld = `.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-reszlet-sor {\n  display: grid;\n  grid-template-columns: 96px minmax(0, 1fr);\n  align-items: start;\n  gap: 10px;\n  margin: 7px 0 0;`;
          const detailNew = `.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-reszlet-sor {\n  display: grid;\n  grid-template-columns: 96px minmax(0, 1fr);\n  align-items: baseline;\n  gap: 10px;\n  margin: 7px 0 0;`;
          if (!css.includes(detailOld)) throw new Error('Canonical booking detail row block not found');
          css = css.replace(detailOld, detailNew);

          const actionsOld = `.admin-body.admin-v2 #admin-panel-foglalasok .admin-db-akciok {\n  margin-top: 7px;\n  padding-top: 7px;\n  border-top: 1px solid rgba(73, 58, 52, .09);\n}`;
          const actionsNew = `.admin-body.admin-v2 #admin-panel-foglalasok .admin-db-akciok {\n  margin-top: 7px;\n  padding: 7px 0 12px;\n  align-items: center;\n  border-top: 1px solid rgba(73, 58, 52, .09);\n}\n.admin-body.admin-v2 #admin-panel-foglalasok .admin-db-akciok [data-foglalas-torles] {\n  padding-inline: 10px;\n}`;
          if (!css.includes(actionsOld)) throw new Error('Canonical booking actions block not found');
          css = css.replace(actionsOld, actionsNew);

          fs.writeFileSync(path, css);
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify targeted ownership
        shell: bash
        run: |
          grep -A8 "admin-foglalas-reszlet-sor {" src/admin-styles/30-bookings.css | grep -q "align-items: baseline"
          grep -A8 "admin-db-akciok {" src/admin-styles/30-bookings.css | grep -q "padding: 7px 0 12px"
          grep -A3 "data-foglalas-torles" src/admin-styles/30-bookings.css | grep -q "padding-inline: 10px"
      - name: Commit verified result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/chatgpt-test-details-spacing.yml
          git add -A
          git commit -m "Align booking details and space delete action"
          git push origin CHATGPT_TEST
