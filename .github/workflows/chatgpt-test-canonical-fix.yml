name: Apply CHATGPT_TEST canonical booking CSS fix

on:
  push:
    branches:
      - CHATGPT_TEST

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Edit canonical CSS rules
        shell: python
        run: |
          from pathlib import Path
          import re

          bookings = Path('src/admin-styles/30-bookings.css')
          css = bookings.read_text(encoding='utf-8')

          # Shorter status while preserving the existing fixed status + calendar-slot + edit grid.
          css = css.replace('--booking-status-width: 154px;', '--booking-status-width: 148px;', 1)

          # Compact collapsed booking card in the existing header rules.
          css = css.replace(
              '  min-height: 96px;\n  gap: 0 12px;\n  padding: 8px 0;',
              '  min-height: 78px;\n  gap: 0 12px;\n  padding: 6px 0;',
              1,
          )
          css = css.replace(
              '  height: 96px;\n  min-height: 96px;',
              '  height: 78px;\n  min-height: 78px;',
              1,
          )

          # Keep the appointment date/time slightly higher inside the compact card.
          css = css.replace(
              '.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-idopont {\n  position: absolute;\n  top: 8px;',
              '.admin-body.admin-v2 #admin-panel-foglalasok .admin-foglalas-idopont {\n  position: absolute;\n  top: 6px;',
              1,
          )

          # Date + start + end: one real 3-column row in the canonical editor rule.
          css = css.replace(
              '  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 8px;',
              '  grid-template-columns: minmax(0, 1.25fr) minmax(0, .875fr) minmax(0, .875fr);\n  gap: 6px;',
              1,
          )
          css = css.replace(
              '.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo:has([data-idopont-mezo="date"]),\n.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo-szeles {\n  grid-column: 1 / -1;\n}',
              '.admin-body.admin-v2 #admin-panel-foglalasok .admin-idopont-szerkeszto .admin-mezo-szeles {\n  grid-column: 1 / -1;\n}',
              1,
          )

          # Constrain native iOS date/time controls inside their own grid cells and reduce typography.
          pattern = re.compile(
              r'(\.admin-body\.admin-v2 #admin-panel-foglalasok \.admin-idopont-szerkeszto input\[type="date"\],\n'
              r'\.admin-body\.admin-v2 #admin-panel-foglalasok \.admin-idopont-szerkeszto input\[type="time"\] \{.*?)(\n\})',
              re.S,
          )
          match = pattern.search(css)
          if not match:
              raise SystemExit('date/time canonical rule not found')
          block = match.group(1)
          replacements = {
              '  inline-size: 100%;': '  inline-size: 100%;',
              '  width: 100%;': '  width: 100%;',
              '  font-size: 13px;': '  font-size: 10px;',
          }
          for old, new in replacements.items():
              block = block.replace(old, new)
          if '  max-inline-size: 100%;' not in block:
              block = block.replace('  width: 100%;', '  width: 100%;\n  max-inline-size: 100%;\n  max-width: 100%;\n  min-inline-size: 0;\n  min-width: 0;', 1)
          block = re.sub(r'  height: \d+px;\n  min-height: \d+px;', '  height: 34px;\n  min-height: 34px;', block, count=1)
          block = re.sub(r'  padding: [^;]+;', '  padding: 0 20px 0 5px;', block, count=1)
          if '  overflow: hidden;' not in block:
              block = block.replace('  min-width: 0;', '  min-width: 0;\n  overflow: hidden;', 1)
          css = css[:match.start()] + block + match.group(2) + css[match.end():]

          # Keep WebKit's internal value wrapper bounded by the actual input box.
          css = css.replace(
              '::-webkit-date-and-time-value {\n  min-width: 0;',
              '::-webkit-date-and-time-value {\n  box-sizing: border-box;\n  width: 100%;\n  max-width: 100%;\n  min-width: 0;',
              1,
          )
          css = css.replace(
              '::-webkit-datetime-edit-fields-wrapper {\n  min-width: 0;',
              '::-webkit-datetime-edit-fields-wrapper {\n  box-sizing: border-box;\n  width: 100%;\n  max-width: 100%;\n  min-width: 0;',
              1,
          )
          css = css.replace(
              '  width: 24px;\n  height: 100%;\n  margin: 0 -4px 0 0;',
              '  width: 22px;\n  max-width: 22px;\n  height: 100%;\n  margin: 0;',
              1,
          )

          bookings.write_text(css, encoding='utf-8')

          # The existing standalone/PWA typography rule must not overwrite booking date/time font size.
          pwa = Path('src/admin-styles/95-pwa.css')
          pwa_css = pwa.read_text(encoding='utf-8')
          old = '.admin-body.admin-v2.lumi-admin-standalone #admin-tartalom input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="reset"]),'
          new = '.admin-body.admin-v2.lumi-admin-standalone #admin-tartalom input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]):not([type="button"]):not([type="submit"]):not([type="reset"]):not([type="date"]):not([type="time"]),'
          if old not in pwa_css:
              raise SystemExit('PWA generic input rule not found')
          pwa.write_text(pwa_css.replace(old, new, 1), encoding='utf-8')

          # Remove the temporary override stylesheet reference; canonical bundle is the only CSS source again.
          admin = Path('admin/index.html')
          html = admin.read_text(encoding='utf-8')
          html = re.sub(r'\n\s*<link rel="stylesheet" href="/chatgpt-test-bookings\.css\?v=[^"]+">', '', html, count=1)
          admin.write_text(html, encoding='utf-8')

      - name: Remove temporary override CSS
        run: rm -f chatgpt-test-bookings.css

      - name: Install dependencies
        run: npm ci

      - name: Build canonical admin CSS
        run: npm run build

      - name: Refresh asset versions
        run: npm run assets:version

      - name: Check admin CSS ownership
        run: npm run admin:css:check

      - name: Remove this temporary workflow
        run: rm -f .github/workflows/chatgpt-test-canonical-fix.yml

      - name: Commit canonical fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix booking layout in canonical admin CSS"
          git push origin CHATGPT_TEST
