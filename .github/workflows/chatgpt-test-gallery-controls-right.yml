name: Build mobile gallery right-column layout

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - '.github/workflows/chatgpt-test-gallery-controls-right.yml'

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify gallery layout source
        run: |
          grep -q '"preview home"' src/admin-styles/45-gallery-editor.css
          grep -q 'grid-area: image-controls;' src/admin-styles/45-gallery-editor.css
          grep -q 'data-cms-path\$=".kepAlt"' src/admin-styles/45-gallery-editor.css
          grep -q 'data-cms-path\$=".magas"' src/admin-styles/45-gallery-editor.css
          ! grep -q '!important' src/admin-styles/45-gallery-editor.css

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Update asset versions
        run: npm run assets:version

      - name: Run checks
        run: npm run check

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Test admin regressions
        run: npm run test:admin

      - name: Remove temporary workflow and commit generated assets
        run: |
          rm -f .github/workflows/chatgpt-test-gallery-controls-right.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 1
          fi
          git commit -m 'Build gallery right-column mobile layout'
          git push origin HEAD:CHATGPT_TEST
