name: One-shot booking CSS patch

on:
  push:
    branches:
      - refactor/admin-css-ownership

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[booking-css-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/admin-css-ownership

      - name: Restore compact mobile pager rule
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/admin-styles/30-bookings.css')
          css = path.read_text(encoding='utf-8')
          anchor = '  .admin-body.admin-v2 #admin-panel-foglalasok .admin-statusz-szuro-mezo { width: 112px; }\n'
          rule = '''  .admin-body.admin-v2 #admin-panel-foglalasok .admin-lapozo-jobb .admin-oldalmeret > span {\n    display: none;\n  }\n'''
          if rule in css:
              raise SystemExit(0)
          if anchor not in css:
              raise SystemExit('Expected mobile booking anchor not found')
          css = css.replace(anchor, anchor + rule, 1)
          path.write_text(css, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin-styles/30-bookings.css
          git commit -m "Restore compact booking pager [booking-css-patched]"
          git push origin HEAD:refactor/admin-css-ownership
