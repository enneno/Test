name: Communications mobile refinement

on:
  push:
    branches:
      - CHATGPT_TEST

permissions:
  contents: write

jobs:
  refine-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Patch canonical admin sources
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}: {old[:90]!r}')
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')

          workspace = 'src/admin-styles/20-workspace.css'
          replace_once(
              workspace,
              ".admin-body.admin-v2 .admin-v2-button:hover {\n",
              ".admin-body.admin-v2 .admin-v2-button[hidden] {\n  display: none;\n}\n\n.admin-body.admin-v2 .admin-v2-button:hover {\n"
          )
          replace_once(
              workspace,
              ".admin-body.admin-v2 .admin-v2-communication-summary > .admin-v2-communication-action {\n  grid-column: 1 / -1;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  gap: 12px;\n}\n",
              ".admin-body.admin-v2 .admin-v2-communication-summary > .admin-v2-communication-action {\n  grid-column: 1 / -1;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  min-height: 44px;\n  padding: 8px 10px;\n  flex-wrap: wrap;\n  gap: 8px 12px;\n  background: var(--admin-v2-surface-soft);\n}\n"
          )
          replace_once(
              workspace,
              "\n.admin-body.admin-v2 .admin-v2-communication-action .admin-v2-button[hidden] {\n  display: none;\n}\n",
              "\n"
          )
          replace_once(
              workspace,
              "  .admin-body.admin-v2 .admin-v2-communication-summary {\n    grid-template-columns: 1fr;\n  }\n\n  .admin-body.admin-v2 .admin-v2-communication-summary > .admin-v2-communication-action {\n    align-items: stretch;\n    flex-direction: column;\n  }\n\n  .admin-body.admin-v2 .admin-v2-communication-action .admin-v2-button {\n    width: 100%;\n  }\n",
              "  .admin-body.admin-v2 .admin-v2-communication-summary {\n    grid-template-columns: repeat(2, minmax(0, 1fr));\n    gap: 8px;\n  }\n\n  .admin-body.admin-v2 .admin-v2-communication-summary > div {\n    padding: 10px 11px;\n  }\n"
          )

          communications = 'src/admin-styles/80-communications.css'
          replace_once(
              communications,
              "/* Event log */\n.admin-body.admin-v2 #admin-panel-esemenynaplo > .admin-panel-akciok { margin: 0 0 11px; }\n.admin-body.admin-v2 #admin-panel-esemenynaplo .admin-lapozo-felso { margin: 7px 0 9px; }\n",
              "/* Event log */\n.admin-body.admin-v2 #admin-panel-esemenynaplo > .admin-panel-akciok { margin: 0 0 6px; }\n.admin-body.admin-v2 #admin-panel-esemenynaplo > .admin-panel-akciok .admin-panel-gombcsoport {\n  display: flex;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 6px;\n}\n.admin-body.admin-v2 #admin-panel-esemenynaplo .admin-lapozo-felso { margin: 4px 0 7px; }\n"
          )
          replace_once(
              communications,
              "@container admin-workspace (max-width: 480px) {\n  .admin-body.admin-v2 #admin-esemenynaplo-lista > .admin-db-kartya { padding: 11px 3px; }\n",
              "@container admin-workspace (max-width: 480px) {\n  .admin-body.admin-v2 #admin-panel-esemenynaplo > .admin-panel-akciok { margin-bottom: 4px; }\n  .admin-body.admin-v2 #admin-panel-esemenynaplo > .admin-panel-akciok .admin-panel-gombcsoport { gap: 5px; }\n  .admin-body.admin-v2 #admin-esemenynaplo-lista > .admin-db-kartya { padding: 11px 3px; }\n"
          )

          pwa = 'src/admin-styles/95-pwa.css'
          replace_once(
              pwa,
              ".admin-body.admin-v2.lumi-admin-standalone .pwa-admin-quick-add:active {\n  transform: translateX(-100%) scale(0.94);\n}\n",
              ".admin-body.admin-v2.lumi-admin-standalone .pwa-admin-quick-add:active {\n  transform: translateX(-100%) scale(0.94);\n}\n\n/* The global quick-add creates a blocked time, so it only belongs to scheduling workflows. */\n.admin-body.admin-v2.lumi-admin-standalone[data-admin-v2-group=\"kommunikacio\"] .pwa-admin-quick-add {\n  display: none;\n}\n"
          )

          test_path = Path('tests/admin-communications-mobile.spec.js')
          test_path.write_text(r'''const { test, expect } = require('playwright/test');
const fs = require('fs');
const path = require('path');

const root = path.join(__dirname, '..');
const css = () => fs.readFileSync(path.join(root, 'admin-v2.css'), 'utf8');

test('mobile communications keeps the summary compact and removes irrelevant PWA quick-add', async ({ page }) => {
    await page.setViewportSize({ width: 390, height: 844 });
    await page.setContent(`<!doctype html><html><head><style>${css()}</style></head><body class="admin-body admin-v2 lumi-admin-standalone" data-admin-v2-group="kommunikacio"><main id="admin-tartalom"><section class="admin-v2-communication-summary"><div><span>Mai email esemény</span><strong>0</strong></div><div><span>Sikeres</span><strong>110</strong></div><div><span>Nyitott hibák</span><strong>0</strong></div><div><span>Legutóbbi hiba</span><strong>Nincs</strong></div><div class="admin-v2-communication-action"><p>Nincs nyitott emailhiba.</p><button type="button" class="admin-v2-button admin-v2-button-secondary" hidden>Emailhibák nyugtázása</button></div></section><button type="button" class="pwa-admin-quick-add" aria-label="Kézzel felvett idő hozzáadása">+</button></main></body></html>`);

    const metrics = await page.evaluate(() => {
        const summary = document.querySelector('.admin-v2-communication-summary');
        const stats = Array.from(summary.children).slice(0, 4);
        const action = summary.querySelector('.admin-v2-communication-action');
        const hiddenButton = action.querySelector('button');
        const quickAdd = document.querySelector('.pwa-admin-quick-add');
        return {
            columns: getComputedStyle(summary).gridTemplateColumns.trim().split(/\s+/).length,
            statMaxHeight: Math.max(...stats.map(card => card.getBoundingClientRect().height)),
            actionHeight: action.getBoundingClientRect().height,
            hiddenButtonDisplay: getComputedStyle(hiddenButton).display,
            quickAddDisplay: getComputedStyle(quickAdd).display,
            overflow: document.documentElement.scrollWidth - window.innerWidth
        };
    });

    expect(metrics.columns).toBe(2);
    expect(metrics.statMaxHeight).toBeLessThanOrEqual(72);
    expect(metrics.actionHeight).toBeLessThanOrEqual(60);
    expect(metrics.hiddenButtonDisplay).toBe('none');
    expect(metrics.quickAddDisplay).toBe('none');
    expect(metrics.overflow).toBeLessThanOrEqual(1);
});
''', encoding='utf-8')
          PY

          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Version assets
        run: npm run assets:version

      - name: Check
        run: npm run check

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Run existing affected admin tests
        run: npm run test:admin

      - name: Run shared and communications regressions
        run: npx playwright test tests/admin-shared-components.spec.js tests/admin-communications-mobile.spec.js

      - name: Commit verified source and generated assets
        shell: bash
        run: |
          rm .github/workflows/chatgpt-test-communications-mobile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine communications mobile layout"
          git push origin HEAD:CHATGPT_TEST
