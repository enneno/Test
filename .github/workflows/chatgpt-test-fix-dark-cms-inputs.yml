name: Fix dark CMS inputs

on:
  push:
    branches:
      - CHATGPT_TEST
    paths:
      - .github/workflows/chatgpt-test-fix-dark-cms-inputs.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Fix CMS field theme ownership and add regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/admin-styles/40-content-editor.css')
          css = css_path.read_text(encoding='utf-8')
          old = '.admin-body.admin-v2 #admin-panel-szovegek .admin-mezo input:not([type="checkbox"]),\n.admin-body.admin-v2 #admin-panel-szovegek .admin-mezo textarea { background: #fff; }\n'
          if css.count(old) != 1:
              raise SystemExit(f'Expected exactly one CMS white-field override, found {css.count(old)}')
          css_path.write_text(css.replace(old, ''), encoding='utf-8')

          test_path = Path('tests/admin-shared-components.spec.js')
          test = test_path.read_text(encoding='utf-8')
          marker = "    expect(content).not.toContain('width: 18px; height: 18px; margin: 0; accent-color');\n"
          assertion = "    expect(content).not.toMatch(/#admin-panel-szovegek \\.admin-mezo input:not\\(\\[type=\\\"checkbox\\\"\\]\\)[\\s\\S]*background:\\s*#fff/);\n"
          if marker not in test:
              raise SystemExit('Shared-components assertion marker not found')
          if assertion not in test:
              test = test.replace(marker, marker + assertion, 1)
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Version assets
        run: npm run assets:version

      - name: Check
        run: npm run check

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Run affected admin tests
        run: npx playwright test tests/admin-shared-components.spec.js tests/admin-content-editor-accordion.spec.js tests/admin-production-redesign.spec.js

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/admin-styles/40-content-editor.css tests/admin-shared-components.spec.js admin-v2.css admin/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix dark mode CMS inputs"
          git push origin CHATGPT_TEST
