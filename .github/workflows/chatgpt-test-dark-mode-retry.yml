name: Admin dark mode retry

on:
  push:
    branches:
      - CHATGPT_TEST

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CHATGPT_TEST
        uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - name: Run corrected dark mode patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/chatgpt-test-dark-mode.yml').read_text(encoding='utf-8')
          step_start = workflow.index('      - name: Patch canonical admin sources\n')
          run_start = workflow.index('        run: |\n', step_start) + len('        run: |\n')
          step_end = workflow.index('\n      - name: Setup Node', run_start)
          indented = workflow[run_start:step_end]
          lines = []
          fixed = False
          for line in indented.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              if "replace_once(content, '  background: rgba(255, 255, 255, .58);" in line:
                  line = line.replace('replace_once(', 'replace_count(', 1)
                  if not line.endswith(')'):
                      raise SystemExit('Unexpected content replacement line shape')
                  line = line[:-1] + ', 2)'
                  fixed = True
              lines.append(line)
          if not fixed:
              raise SystemExit('Could not locate the dark-mode content background replacement')
          Path('/tmp/dark-mode-patch.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/dark-mode-patch.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Version assets
        run: npm run assets:version

      - name: Check
        run: npm run check

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Run affected admin tests
        run: npm run test:admin

      - name: Commit verified dark mode
        shell: bash
        run: |
          rm .github/workflows/chatgpt-test-dark-mode.yml
          rm .github/workflows/chatgpt-test-dark-mode-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add persistent admin dark mode"
          git push origin HEAD:CHATGPT_TEST
