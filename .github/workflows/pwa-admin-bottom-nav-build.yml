name: PWA admin bottom nav build

on:
  push:
    branches:
      - pwa-admin-bottom-nav

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build bundles
        run: npm run build

      - name: Refresh asset versions
        run: npm run assets:version

      - name: Verify site and admin component system
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run targeted standalone admin shell test
        shell: bash
        run: |
          npm run serve > /tmp/luminails-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8101/admin/ >/dev/null; then
              break
            fi
            sleep 1
          done
          npx playwright test tests/pwa.spec.js --grep "standalone admin uses icon tabbar" --project=chromium

      - name: Commit generated admin assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-v2.css admin/index.html
          if git diff --cached --quiet; then
            echo "No generated admin changes to commit."
            exit 0
          fi
          git commit -m "Build standalone admin app shell"
          git push origin HEAD:pwa-admin-bottom-nav
