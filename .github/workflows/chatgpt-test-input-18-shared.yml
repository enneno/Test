name: Set CHATGPT_TEST shared input typography to 18px
on:
  push:
    branches: [CHATGPT_TEST]
    paths: ['.github/workflows/chatgpt-test-input-18-shared.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Make text input typography shared
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/admin-styles/10-components.css')
          s = p.read_text()
          old = '''  --admin-ui-input-font-size: 12px;'''
          if old not in s:
              raise SystemExit('base input font size not found')
          s = s.replace(old, '  --admin-ui-input-font-size: 18px;', 1)
          browser = '''\n@media (display-mode: browser) and (max-width: 768px) {\n  .admin-body.admin-v2 {\n    --admin-ui-input-font-size: 16px;\n  }\n}\n'''
          if browser not in s:
              raise SystemExit('browser input override not found')
          s = s.replace(browser, '\n', 1)
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - run: npm run assets:version
      - run: npm run admin:css:check
      - name: Verify shared input typography
        run: |
          grep -q -- '--admin-ui-input-font-size: 18px;' src/admin-styles/10-components.css
          ! grep -q -- '--admin-ui-input-font-size: 16px;' src/admin-styles/10-components.css
          grep -q 'font-size: var(--admin-ui-input-font-size);' src/admin-styles/10-components.css
      - name: Commit generated assets and remove workflow
        run: |
          rm -f .github/workflows/chatgpt-test-input-18-shared.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use shared 18px admin text inputs"
          git push origin CHATGPT_TEST
