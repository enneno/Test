name: Unify admin workspace spacing

on:
  push:
    branches: [CHATGPT_TEST]
    paths:
      - '.github/workflows/chatgpt-test-workspace-spacing.yml'

permissions:
  contents: write

jobs:
  unify-spacing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: CHATGPT_TEST
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply canonical workspace spacing system
        run: python3 scripts/chatgpt-workspace-spacing-system.py

      - name: Verify canonical ownership
        run: |
          grep -q -- '--admin-v2-shell-top-reserve' src/admin-styles/20-workspace.css
          grep -q -- '--admin-v2-shell-bottom-reserve' src/admin-styles/20-workspace.css
          grep -q -- '--admin-v2-workspace-top-gap' src/admin-styles/20-workspace.css
          grep -q 'position: fixed;' src/admin-styles/20-workspace.css
          grep -q -- '--admin-v2-shell-top-reserve: 0px;' src/admin-styles/95-pwa.css
          grep -q 'collectAdminHeadingTops' tests/admin-production-redesign.spec.js
          ! grep -q 'padding: 16px 12px calc(var(--pwa-admin-toolbar-height)' src/admin-styles/95-pwa.css

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Update asset versions
        run: npm run assets:version

      - name: Run source and CSS checks
        run: npm run check

      - name: Install Edge for Playwright
        run: npx playwright install --with-deps msedge

      - name: Test admin regressions
        run: npm run test:admin

      - name: Test PWA shell
        run: npx playwright test tests/pwa.spec.js

      - name: Remove temporary helper and workflow, then commit
        run: |
          rm -f scripts/chatgpt-workspace-spacing-system.py
          rm -f .github/workflows/chatgpt-test-workspace-spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'Unify admin workspace shell spacing'
          git push origin HEAD:CHATGPT_TEST
